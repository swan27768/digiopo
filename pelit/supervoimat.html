<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Supervoima-etsintä</title>
  <link rel="stylesheet" href="/vendor/fonts/fonts.css">
  <style>
    :root {
      --bg:      #f6f7fb;
      --card:    #ffffff;
      --accent:  #d62b52;
      --gold:    #a85f00;
      --teal:    #00796a;
      --purple:  #6b46c1;
      --blue:    #0a6fc2;
      --text:    #1f2340;
      --muted:   #5b6082;
      --border:  rgba(31,35,64,0.14);
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: 'Nunito', sans-serif;
      min-height: 100vh;
    }
    #app {
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding: 1rem;
    }
    .screen {
      width: 100%;
      max-width: 680px;
      padding: 1.5rem 1rem 4rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Progress */
    .pbar {
      width: 100%; max-width: 480px;
      height: 8px;
      background: rgba(31,35,64,0.10);
      border-radius: 99px;
      margin-bottom: 1.5rem;
      overflow: hidden;
    }
    .pfill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), #e8870e);
      border-radius: 99px;
      transition: width 0.4s ease;
    }

    /* Headings */
    h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 2rem; font-weight: 700;
      color: var(--accent);
      text-align: center;
      margin: 0.4rem 0 1rem;
      letter-spacing: -0.5px;
    }
    h2 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.35rem; font-weight: 700;
      color: var(--gold);
      text-align: center;
      margin: 0.4rem 0 0.7rem;
    }
    h3 {
      font-size: 1.05rem; font-weight: 700;
      color: var(--text);
      text-align: center;
      margin: 0.4rem 0 0.6rem;
    }

    /* Cards */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.1rem 1.3rem;
      margin: 0.4rem 0;
      width: 100%;
      line-height: 1.7;
    }
    .card-info {
      background: rgba(0,121,106,0.07);
      border: 1px solid rgba(0,121,106,0.25);
      border-radius: 12px;
      padding: 0.75rem 1rem;
      font-size: 0.9rem;
      color: var(--teal);
      margin: 0.4rem 0;
      width: 100%;
    }
    .card-warn {
      background: rgba(168,95,0,0.07);
      border: 1px solid rgba(168,95,0,0.25);
      border-radius: 12px;
      padding: 0.7rem 1rem;
      font-size: 0.88rem;
      color: var(--gold);
      margin: 0.4rem 0;
      width: 100%;
      text-align: center;
    }

    /* Buttons */
    .btn-group {
      display: flex; flex-direction: column;
      gap: 0.55rem;
      width: 100%; margin: 0.8rem 0;
    }
    .btn {
      display: block; width: 100%;
      padding: 0.8rem 1.1rem;
      background: var(--card);
      border: 2px solid var(--border);
      border-radius: 14px;
      color: var(--text);
      font-family: 'Nunito', sans-serif;
      font-size: 0.98rem; font-weight: 600;
      text-align: left; cursor: pointer;
      transition: border-color 0.15s, background 0.15s, transform 0.15s;
      line-height: 1.4;
    }
    .btn:hover, .btn:focus-visible {
      border-color: var(--accent);
      background: rgba(214,43,82,0.08);
      transform: translateX(4px);
      outline: none;
    }
    .btn-primary {
      background: var(--accent); border-color: var(--accent);
      color: #fff; text-align: center;
      font-weight: 800; font-size: 1.02rem;
    }
    .btn-primary:hover, .btn-primary:focus-visible {
      background: #b8203f; border-color: #b8203f;
      transform: translateY(-2px);
    }
    .btn-gold {
      background: rgba(168,95,0,0.1); border-color: var(--gold);
      color: var(--gold); text-align: center; font-weight: 700;
    }
    .btn-gold:hover, .btn-gold:focus-visible {
      background: rgba(168,95,0,0.2); transform: translateY(-2px);
    }
    .btn-teal {
      background: rgba(0,121,106,0.1); border-color: var(--teal);
      color: var(--teal); text-align: center; font-weight: 700;
    }
    .btn-teal:hover, .btn-teal:focus-visible {
      background: rgba(0,121,106,0.2); transform: translateY(-2px);
    }
    .btn-ghost {
      background: transparent;
      border-color: rgba(31,35,64,0.14);
      color: var(--muted); text-align: center;
    }
    .btn-ghost:hover, .btn-ghost:focus-visible {
      border-color: var(--teal); color: var(--teal); transform: none;
    }

    /* Route grid */
    .route-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.65rem;
      width: 100%; margin: 0.8rem 0;
    }
    .route-btn {
      background: var(--card);
      border: 2px solid var(--border);
      border-radius: 14px;
      padding: 0.9rem 0.7rem;
      cursor: pointer;
      text-align: center;
      font-family: 'Nunito', sans-serif;
      font-weight: 700; font-size: 0.9rem;
      color: var(--text);
      transition: border-color 0.15s, background 0.15s;
      position: relative;
    }
    .route-btn:hover, .route-btn:focus-visible {
      border-color: var(--gold);
      background: rgba(168,95,0,0.08);
      outline: none;
    }
    .route-btn.done {
      border-color: var(--teal);
      background: rgba(0,121,106,0.07);
    }
    .route-btn .done-mark {
      position: absolute; top: 6px; right: 8px;
      font-size: 0.75rem; color: var(--teal);
    }
    .route-btn .remoji { font-size: 1.7rem; display: block; margin-bottom: 0.2rem; }

    /* Emoji big */
    .bigmoji { font-size: 3.2rem; display: block; text-align: center; margin: 0.5rem 0; }

    /* Result card */
    .result-card {
      background: linear-gradient(135deg, #ffffff, #fdf0f3);
      border: 2px solid var(--accent);
      border-radius: 20px;
      padding: 1.4rem;
      width: 100%; text-align: center;
      margin: 0.4rem 0;
    }
    .type-badge {
      display: inline-block;
      background: var(--accent); color: #fff;
      font-weight: 800; font-size: 1.15rem;
      padding: 0.25rem 1.1rem;
      border-radius: 99px; margin: 0.4rem 0;
    }
    .str-list {
      list-style: none; padding: 0; margin: 0.5rem 0;
      display: flex; flex-wrap: wrap;
      gap: 0.4rem; justify-content: center;
    }
    .str-tag {
      background: rgba(168,95,0,0.12);
      border: 1px solid var(--gold);
      color: var(--gold);
      border-radius: 99px;
      padding: 0.2rem 0.7rem;
      font-size: 0.88rem; font-weight: 700;
    }

    /* Strength card */
    .vk-card {
      background: #ffffff;
      border: 3px solid var(--gold);
      border-radius: 20px;
      padding: 1.5rem;
      width: 100%; max-width: 380px;
      text-align: center;
    }

    /* Teacher box */
    .teacher-box {
      background: rgba(107,70,193,0.08);
      border: 1px solid rgba(107,70,193,0.3);
      border-radius: 14px;
      padding: 1rem 1.2rem;
      width: 100%; margin: 0.5rem 0;
    }
    .teacher-box h4 {
      color: #6b46c1; margin: 0 0 0.5rem;
      font-size: 0.82rem; text-transform: uppercase; letter-spacing: 0.06em;
    }
    pre {
      white-space: pre-wrap; word-break: break-word;
      font-family: 'Nunito', sans-serif;
      font-size: 0.86rem; color: var(--muted); margin: 0;
    }

    /* Textarea */
    textarea {
      width: 100%;
      background: #ffffff;
      border: 1px solid rgba(31,35,64,0.2);
      border-radius: 10px;
      color: var(--text);
      font-family: 'Nunito', sans-serif;
      font-size: 0.93rem;
      padding: 0.65rem 0.8rem;
      resize: vertical; min-height: 80px;
      line-height: 1.5;
    }
    textarea:focus { outline: 2px solid var(--teal); border-color: var(--teal); }
    textarea::placeholder { color: var(--muted); }

    /* Cover */
    .cover { text-align: center; padding: 2rem 0 0.5rem; width: 100%; }
    .cover-logo {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 2.4rem; font-weight: 700;
      color: var(--accent); line-height: 1.1;
    }
    .cover-sub {
      color: var(--muted); font-size: 1.02rem;
      margin: 0.7rem 0 1.5rem; line-height: 1.55;
    }

    /* Puhekupla: joku kysyy oppilaalta */
    .kupla {
      position: relative;
      width: 100%;
      background: #e6f4f1;
      border: 1.5px solid rgba(0,121,106,0.4);
      border-radius: 20px 20px 20px 4px;
      padding: 0.9rem 1.2rem;
      margin: 0.6rem 0 1.6rem;
      color: #00604f;
      font-size: 1rem; font-weight: 600; line-height: 1.55;
    }
    .kupla::before, .kupla::after {
      content: ""; position: absolute; left: 22px; width: 0; height: 0;
      border-style: solid;
    }
    .kupla::before {
      bottom: -15px;
      border-width: 15px 0 0 18px;
      border-color: rgba(0,121,106,0.4) transparent transparent transparent;
    }
    .kupla::after {
      bottom: -12px; left: 24px;
      border-width: 13px 0 0 15px;
      border-color: #e6f4f1 transparent transparent transparent;
    }
    /* Kupla + robo. Kapealla: kupla ja robo sen alla. Leveällä: kortti | kupla | robo */
    .intro-rivi { width: 100%; display: flex; flex-direction: column; }
    .puhe { display: flex; flex-direction: column; }
    .robo { width: 110px; height: auto; align-self: flex-start; margin: -0.6rem 0 0 0.6rem; }
    @media (min-width: 720px) {
      .screen:has(.intro-rivi) { max-width: 980px; }
      .intro-rivi { flex-direction: row; align-items: flex-start; gap: 1.6rem; }
      .intro-rivi .card { flex: 1.2; margin: 0.6rem 0; }
      .puhe { flex: 1.35; flex-direction: row; align-items: flex-start; gap: 1.6rem; }
      .puhe .kupla {
        flex: 1; margin: 1.4rem 0 0.6rem;
        border-radius: 20px 4px 20px 20px;
      }
      .puhe .kupla::before, .puhe .kupla::after { bottom: auto; left: auto; }
      .puhe .kupla::before {
        top: 14px; right: -17px;
        border-width: 10px 0 10px 17px;
        border-color: transparent transparent transparent rgba(0,121,106,0.4);
      }
      .puhe .kupla::after {
        top: 16px; right: -14px;
        border-width: 8px 0 8px 14px;
        border-color: transparent transparent transparent #e6f4f1;
      }
      .robo { width: 150px; margin: 0; align-self: flex-end; }
    }

    .card, .btn, .route-btn, .result-card, .vk-card { box-shadow: 0 1px 3px rgba(20,20,60,0.07); }
    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
    }
    [tabindex="-1"]:focus { outline: none; }

    /* Print */
    @media print {
      body { background: #fff !important; }
      .btn-group, .card-info, .card-warn, h1 { display: none !important; }
      .vk-card {
        border-color: #222 !important;
        background: #fff !important;
        color: #222 !important;
        max-width: 100% !important;
      }
      .type-badge { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      .str-tag {
        border-color: #555 !important;
        color: #333 !important;
        background: #eee !important;
        -webkit-print-color-adjust: exact; print-color-adjust: exact;
      }
    }

<script>
// ─── STATE ───────────────────────────────────────────────────────────────────
const S = {
  scores: {},
  types: { Tekijä:0, Ajattelija:0, Auttaja:0, Luova:0, Seikkailija:0, Johtaja:0 },
  done: new Set(),
  routeAns: {},   // reitti -> valitut vaihtoehdot (pisteet lasketaan vasta valmiista reiteistä)
  qtAns: null,    // pikatestin vastaukset
  pending: [],    // keskeneräisen reitin/pikatestin vastaukset
  result: null,   // tyyppi lasketaan vain kerran
  reflection: '',
  development: '',
  reflSaved: false,
  currentRoute: null,
  routeStep: 0,
  qtStep: 0
};

// ─── HELPERS ─────────────────────────────────────────────────────────────────
const addStr = s => { S.scores[s] = (S.scores[s] || 0) + 1; };
const addTyp = t => { S.types[t] = (S.types[t] || 0) + 1; };

// Tulokseen riittää pikatesti tai vähintään kaksi valmista reittiä
function routesDone() { return Object.keys(ROUTES).filter(k => S.done.has(k)).length; }
function isReady()    { return S.done.has('pikatesti') || routesDone() >= 2; }

function recompute() {
  S.scores = {};
  S.types  = { Tekijä:0, Ajattelija:0, Auttaja:0, Luova:0, Seikkailija:0, Johtaja:0 };
  for (const [id, ans] of Object.entries(S.routeAns)) {
    ans.forEach((oi, qi) => { const o = ROUTES[id].questions[qi].opts[oi]; o.s.forEach(addStr); addTyp(o.t); });
  }
  if (S.qtAns) S.qtAns.forEach((oi, qi) => { const o = QT[qi].opts[oi]; addStr(o.s); addTyp(o.t); });
  S.result = null;
}
function bestType() {
  if (S.result) return S.result;
  let max = 0, tied = [];
  for (const [k,v] of Object.entries(S.types)) {
    if (v > max)       { max = v; tied = [k]; }
    else if (v === max && v > 0) { tied.push(k); }
  }
  if (tied.length === 0) return 'Tekijä'; // fallback jos ei yhtään vastausta
  S.result = tied[Math.floor(Math.random() * tied.length)]; // arvonta vain kerran
  return S.result;
}
function topStrengths(n) {
  return Object.entries(S.scores).sort((a,b) => b[1]-a[1]).slice(0,n).map(e=>e[0]);
}
function pb(pct, lbl) {
  return `<div class="pbar" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100" aria-label="${lbl||'Edistyminen '+pct+'%'}"><div class="pfill" style="width:${pct}%"></div></div>`;
}
const $ = id => document.getElementById(id);
const EMOJI_RE = /(?:\p{Extended_Pictographic}(?:\uFE0F|\u200D\p{Extended_Pictographic})*|[✓→←])/gu;
// Emojit ja nuolet piiloon ruudunlukijalta (teksti jää luettavaksi)
function hideEmojis(root) {
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  const nodes = [];
  while (walker.nextNode()) nodes.push(walker.currentNode);
  nodes.forEach(n => {
    const p = n.parentElement;
    if (!p || p.closest('textarea, pre, script, style, [aria-hidden="true"]')) return;
    EMOJI_RE.lastIndex = 0;
    if (!EMOJI_RE.test(n.nodeValue)) return;
    EMOJI_RE.lastIndex = 0;
    const frag = document.createDocumentFragment();
    let last = 0, m;
    const txt = n.nodeValue;
    while ((m = EMOJI_RE.exec(txt)) !== null) {
      if (m.index > last) frag.appendChild(document.createTextNode(txt.slice(last, m.index)));
      const sp = document.createElement('span');
      sp.setAttribute('aria-hidden', 'true');
      sp.textContent = m[0];
      frag.appendChild(sp);
      last = m.index + m[0].length;
    }
    if (last < txt.length) frag.appendChild(document.createTextNode(txt.slice(last)));
    n.replaceWith(frag);
  });
}
let firstRender = true;
function render(html) {
  const scr = $('screen');
  scr.innerHTML = html;
  hideEmojis(scr);
  window.scrollTo(0,0);
  // Siirrä fokus uuden näkymän otsikkoon, jotta ruudunlukija huomaa sisällön vaihtuneen
  if (firstRender) { firstRender = false; return; }
  const h = scr.querySelector('h1, h2, .cover-logo');
  if (h) { h.setAttribute('tabindex', '-1'); h.focus({ preventScroll: true }); }
}

// ─── SCREENS ─────────────────────────────────────────────────────────────────

function showStart() {
  render(`
    <div class="cover">
      <span class="bigmoji">🔍</span>
      <div class="cover-logo">Supervoima-<br>etsintä</div>
      <p class="cover-sub">Sinussa on vahvuuksia, joita et ehkä itse huomaa.<br>Etsitään ne yhdessä!</p>
    </div>
    <div class="btn-group" style="max-width:360px;width:100%">
      <button class="btn btn-primary" onclick="showIntro()">Aloita matka →</button>
    </div>
    <p style="color:var(--muted);font-size:0.85rem;text-align:center;margin-top:0.8rem">Kesto: noin 5–10 minuuttia</p>
  `);
}

function showIntro() {
  render(`
    ${pb(5)}
    <h1>Mikä on supervoima?</h1>
    <div class="intro-rivi">
    <div class="card">
      Supervoima on jotain, mikä on sinulle <strong>helppoa ja luontevaa</strong>. Se voi olla taito tai tapa toimia.<br><br>
      Sinun ei tarvitse olla siinä paras. Riittää, että se tuntuu sinusta omalta.
    </div>
    <div class="puhe">
    <div class="kupla">
      Mieti hetki: onko joku sanonut sinulle "olet hyvä tässä"? Onko jokin asia sinulle helpompaa kuin muille?
    </div>
    <img class="robo" src="/images/supervoimat-robo.webp" width="360" height="625" alt="" aria-hidden="true">
    </div>
    </div>
    <div class="btn-group" style="max-width:360px;width:100%;margin-top:1rem">
      <button class="btn btn-primary" onclick="showRouteSelect()">Selvä, lähdetään! →</button>
    </div>
  `);
}

function showRouteSelect() {
  const ids = Object.keys(ROUTES);
  const ready = isReady();
  const need  = 2 - routesDone();
  const ptDone  = S.done.has('pikatesti');

  const cards = ids.map(id => {
    const r = ROUTES[id];
    const done = S.done.has(id);
    return `<button class="route-btn${done?' done':''}" onclick="startRoute('${id}')">${done?'<span class="done-mark" aria-hidden="true">✓</span><span class="sr-only">(tehty)</span>':''}<span class="remoji">${r.emoji}</span>${r.name}</button>`;
  }).join('');

  render(`
    ${pb(12)}
    <h1>Mistä lähdetään?</h1>
    <div class="card">Vahvuuksia löytyy joka paikasta. Valitse reitti, joka tuntuu sinusta hyvältä. Voit tehdä myös useamman.</div>
    <div class="route-grid">${cards}</div>
    <div style="width:100%;margin:0.3rem 0">
      <button class="btn ${ptDone?'btn-ghost':'btn-gold'}" onclick="startQuickTest()">
        ${ptDone?'✓ Pikatesti (tehty)':'⚡ Pikatesti – 5 kysymystä nopeasti'}
      </button>
    </div>
    ${ready
      ? `<div style="width:100%;margin-top:0.6rem">
          <p class="card-warn">💡 Mitä useamman reitin teet, sitä paremmin tulos kuvaa sinua!</p>
          <button class="btn btn-primary" onclick="showReflection()">✅ Olen valmis – katso tulokset →</button>
         </div>`
      : `<p class="card-warn">💡 Tulosta varten tee ${need===2?'kaksi reittiä':'vielä yksi reitti'} tai pikatesti. Mitä enemmän vastaat, sitä paremmin tulos kuvaa sinua!</p>`}
  `);
}

function startRoute(id) {
  S.currentRoute = id; S.routeStep = 0; S.pending = [];
  showRouteQ();
}

function showRouteQ() {
  const r = ROUTES[S.currentRoute];
  const q = r.questions[S.routeStep];
  const pct = 25 + Math.round((S.routeStep / r.questions.length) * 15);
  const opts = q.opts.map((o,i) =>
    `<button class="btn" onclick="answerRoute(${i})">${o.text}</button>`).join('');
  render(`
    ${pb(pct)}
    <h2>${r.emoji} ${r.title}</h2>
    ${S.routeStep===0 ? `<div class="card-info">${r.intro}</div>` : ''}
    <div class="card"><strong>${q.text}</strong></div>
    <div class="btn-group">${opts}</div>
    <button class="btn btn-ghost" style="width:auto;padding:0.4rem 1rem;font-size:0.88rem" onclick="showRouteSelect()">← Takaisin reitinvalintaan</button>
  `);
}

function answerRoute(i) {
  const r = ROUTES[S.currentRoute];
  S.pending.push(i);
  if (S.routeStep < r.questions.length-1) { S.routeStep++; showRouteQ(); }
  else {
    S.routeAns[S.currentRoute] = S.pending.slice(); S.pending = [];
    S.done.add(S.currentRoute); recompute(); showRouteDone();
  }
}

function showRouteDone() {
  const r = ROUTES[S.currentRoute];
  const left = Object.keys(ROUTES).filter(k => !S.done.has(k)).length;
  render(`
    ${pb(40)}
    <span class="bigmoji">${r.emoji}</span>
    <h2>${r.name} – valmis!</h2>
    <div class="card" style="text-align:center">
      Hienoa! Löysit tältä reitiltä vahvuuksia.
      ${left>0 ? (isReady() ? `<br><br>Jäljellä on vielä ${left} reittiä. Haluatko tehdä niitä?` : `<br><br>Tulosta varten tee vielä yksi reitti tai pikatesti.`) : '<br><br>Olet tehnyt kaikki reitit!'}
    </div>
    <div class="btn-group" style="max-width:360px;width:100%;margin-top:0.5rem">
      ${isReady() ? `<button class="btn btn-primary" onclick="showReflection()">Olen valmis – katso tulokset →</button>` : ''}
      ${left>0 ? `<button class="btn ${isReady()?'btn-gold':'btn-primary'}" onclick="showRouteSelect()">${isReady()?'Teen vielä lisää reittejä':'Seuraava reitti →'}</button>` : ''}
    </div>
  `);
}

function startQuickTest() { S.qtStep = 0; S.pending = []; showQTQ(); }

function showQTQ() {
  const q = QT[S.qtStep];
  const pct = 20 + Math.round((S.qtStep / QT.length)*60);
  const opts = q.opts.map((o,i) =>
    `<button class="btn" onclick="answerQT(${i})">${o.text}</button>`).join('');
  render(`
    ${pb(pct)}
    <h2>⚡ Pikatesti</h2>
    <div class="card-info">Kysymys ${S.qtStep+1}/${QT.length} – Valitse ensimmäinen vaihtoehto, joka tulee mieleen!</div>
    <div class="card"><strong>${q.text}</strong></div>
    <div class="btn-group">${opts}</div>
  `);
}

function answerQT(i) {
  S.pending.push(i); S.qtStep++;
  if (S.qtStep < QT.length) { showQTQ(); }
  else {
    S.qtAns = S.pending.slice(); S.pending = [];
    S.done.add('pikatesti'); recompute();
    render(`
      ${pb(85)}
      <span class="bigmoji">🎯</span>
      <h2>Pikatesti valmis!</h2>
      <div class="card" style="text-align:center">Hienoa! Vastasit viiteen kysymykseen. Nyt sinulla on jo vahvuuksia.</div>
      <div class="btn-group" style="max-width:360px;width:100%;margin-top:0.5rem">
        <button class="btn btn-primary"  onclick="showReflection()">Jatka tuloksiin →</button>
        <button class="btn btn-gold"     onclick="showRouteSelect()">Tee myös reittejä</button>
      </div>
    `);
  }
}

function showReflection() {
  render(`
    ${pb(85)}
    <h2>✍️ Oma pohdinta</h2>
    <div class="card-info">Tätä ei arvostella. Kirjoita rehellisesti tai jätä tyhjäksi. Molemmat käyvät!</div>
    <div class="card">
      <h3 style="text-align:left;margin-top:0">Missä olet mielestäsi hyvä?</h3>
      <textarea id="ref1" placeholder="Esim. olen hyvä selittämään asioita, keksin ideoita, olen reilu…">${S.reflection}</textarea>
    </div>
    <div class="card">
      <h3 style="text-align:left;margin-top:0">Minkä vahvuuden haluaisit saada vahvemmaksi?</h3>
      <textarea id="ref2" placeholder="Esim. haluaisin olla rohkeampi tai kärsivällisempi…">${S.development}</textarea>

      <button class="btn btn-primary" onclick="saveReflection()">Tallenna ja katso tulokset →</button>

    </div>
  `);
}

function saveReflection() {
  S.reflection  = $('ref1').value;
  S.development = $('ref2').value;
  S.reflSaved   = true;
  showResults();
}

function showResults() {
  const type = bestType();
  const td   = TYPES[type];
  const top5 = topStrengths(5);

  const strHtml = top5.length > 0
    ? `<ul class="str-list">${top5.map(s=>`<li><span class="str-tag">${s}</span></li>`).join('')}</ul>`
    : `<p style="color:var(--muted);font-size:0.9rem">Tee vähintään yksi reitti tai pikatesti, niin näet vahvuutesi.</p>`;

  render(`
    ${pb(100,'Valmis')}
    <h1>🎉 Sinun supervoimasi</h1>
    <div class="card-warn">ℹ️ Tulos on suuntaa-antava. Se perustuu muutamaan vastaukseen, joten se ei kerro sinusta kaikkea.</div>

    <div class="result-card">
      <span class="bigmoji">${td.emoji}</span>
      <div class="type-badge" style="background:${td.color}">${type}</div>
      <p style="margin:0.8rem 0 0.4rem">${td.desc}</p>
      <p style="color:var(--teal);font-size:0.88rem;font-style:italic;margin:0">${td.super}</p>
      <p style="color:var(--muted);font-size:0.85rem;margin:0.7rem 0 0">Tämä on tämänhetkinen suuntasi, ja se voi muuttua.</p>
    </div>

    ${top5.length > 0 ? `<div class="card"><h3>⭐ Löytämäsi supervoimat</h3>${strHtml}<p style="color:var(--muted);font-size:0.8rem;text-align:center;margin:0.6rem 0 0">Vahvuudet ovat peräisin VIA-luonteenvahvuuksista. Se on tutkijoiden tekemä lista ihmisen vahvuuksista.</p></div>` : ''}

    <div class="card" style="margin-top:1rem">
      <h3>💬 Parikeskustelu</h3>
      <p style="margin:0.3rem 0;text-align:center">Kerro kaverille, mitkä supervoimat sait. Kysy häneltä:</p>
      <p style="margin:0.5rem 0;text-align:center"><strong>Minkä vahvuuden sinä näet minussa?</strong></p>
      <p style="margin:0.3rem 0 0;text-align:center;color:var(--muted);font-size:0.9rem">Yllättikö kaverin vastaus sinut?</p>
    </div>

    <div class="btn-group" style="max-width:360px;width:100%;margin-top:1rem">
      <button class="btn btn-primary" id="pdfBtn" onclick="lataaPdf()">📄 Lataa PDF</button>
    </div>
    <div class="card-warn" role="note">📌 Muista palauttaa PDF Classroomiin opolle.</div>
    <p id="pdfMsg" class="sr-only" aria-live="polite"></p>

    <div class="btn-group" style="max-width:360px;width:100%;margin-top:1rem">
      <button class="btn btn-ghost" onclick="resetAll()">🔄 Aloita alusta</button>
    </div>
  `);

}

function hexRgb(h) { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }

function lataaJsPdf() {
  if (window.jspdf) return Promise.resolve();
  return new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = '/vendor/jspdf/jspdf.umd.min.js';
    s.onload = res; s.onerror = rej;
    document.head.appendChild(s);
  });
}

async function lataaPdf() {
  const btn = $('pdfBtn'), msg = $('pdfMsg');
  try {
    btn.disabled = true;
    await lataaJsPdf();
    const type = bestType(), td = TYPES[type], top5 = topStrengths(5);
    const date = new Date().toLocaleDateString('fi-FI');
    const d = new window.jspdf.jsPDF({ unit: 'mm', format: 'a4' });
    const X = 20, W = 170;
    let y;
    const ink = () => d.setTextColor(31, 35, 64);
    const need = h => { if (y + h > 280) { d.addPage(); y = 20; } };
    const para = (text, size, style, color) => {
      d.setFont('helvetica', style || 'normal'); d.setFontSize(size);
      color ? d.setTextColor(...color) : ink();
      d.splitTextToSize(text, W).forEach(line => { need(size * 0.5); d.text(line, X, y); y += size * 0.5; });
    };
    const head = text => { y += 6; need(12); d.setFont('helvetica', 'bold'); d.setFontSize(13); ink(); d.text(text, X, y); y += 7; };

    // Yläpalkki
    d.setFillColor(214, 43, 82); d.rect(0, 0, 210, 34, 'F');
    d.setTextColor(255, 255, 255); d.setFont('helvetica', 'bold'); d.setFontSize(22);
    d.text('Supervoima-etsintä', X, 17);
    d.setFont('helvetica', 'normal'); d.setFontSize(11);
    d.text('Päivämäärä: ' + date, X, 27);

    // Tyyppi
    y = 50;
    d.setFont('helvetica', 'bold'); d.setFontSize(13); ink(); d.text('Suuntani', X, y);
    y += 5;
    d.setFont('helvetica', 'bold'); d.setFontSize(15);
    const bw = d.getTextWidth(type) + 14;
    d.setFillColor(...hexRgb(td.color)); d.roundedRect(X, y, bw, 10, 5, 5, 'F');
    d.setTextColor(255, 255, 255); d.text(type, X + 7, y + 7);
    y += 20;
    para(td.desc, 11);
    y += 2;
    para(td.super, 11, 'italic', [0, 121, 106]);

    // Vahvuudet
    head('Supervoimani');
    top5.forEach((s, i) => para((i + 1) + '. ' + s, 12, 'bold'));

    // Pohdinta
    if (S.reflection.trim())  { head('Missä olen mielestäni hyvä?'); para(S.reflection.trim(), 11); }
    if (S.development.trim()) { head('Haluan saada vahvemmaksi'); para(S.development.trim(), 11); }

    // Alatunniste
    d.setPage(d.getNumberOfPages());
    d.setFont('helvetica', 'normal'); d.setFontSize(9); d.setTextColor(91, 96, 130);
    d.text('Tulos on suuntaa-antava. Tämä on tämänhetkinen suuntani, ja se voi muuttua.', X, 285);

    d.save('supervoimani.pdf');
    btn.textContent = '✅ PDF ladattu'; hideEmojis(btn);
    msg.textContent = 'PDF ladattu. Muista palauttaa se Classroomiin opolle.';
  } catch (e) {
    msg.textContent = 'PDF:n lataus ei onnistunut.';
    btn.textContent = '📄 Yritä PDF:ää uudelleen'; hideEmojis(btn);
  } finally { btn.disabled = false; }
}

function resetAll() {
  S.scores = {};
  S.types  = { Tekijä:0, Ajattelija:0, Auttaja:0, Luova:0, Seikkailija:0, Johtaja:0 };
  S.done   = new Set();
  S.routeAns = {}; S.qtAns = null; S.pending = []; S.result = null;
  S.reflection = ''; S.development = '';
  S.reflSaved  = false;
  showStart();
}

// ─── INIT ─────────────────────────────────────────────────────────────────────
showStart();
