<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="robots" content="noindex"/>
<title>Itsearviointi</title>
<style>
  :root{--primary:#7c3aed;--primary-hover:#6d28d9;--card:#fff;--border:#e9d5ff;--text:#1e1b4b;--text-light:#6b21a8}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#faf5ff;color:var(--text);padding:12px}
</style>
</head>
<body>
<div id="itsearviointi-sisalto"></div>
<script>
/* Itsearviointi-lomake (1–5). Avataan luokkasivulta iframeen:
   tehtavat/itsearviointi.html?luokka=7|8|9&kieli=fi
   Mitään ei lähetetä palvelimelle: oppilas lataa vastauksensa tekstitiedostona
   ja palauttaa sen opettajalle Google Classroomin kautta. */
(function () {
  "use strict";
  var params = new URLSearchParams(location.search);
  var LUOKKA = params.get("luokka");
  var kortti = document.getElementById("itsearviointi-sisalto");
  if (["7", "8", "9"].indexOf(LUOKKA) < 0 || !kortti) return;
  var KIELI = (params.get("kieli") || "fi").toLowerCase().slice(0, 2);

  var VAITTEET = {
    "7": {
      fi: ["Tiedän, miten opin parhaiten.", "Tiedän, mikä saa minut innostumaan koulussa.", "Osaan nimetä kolme vahvuuttani.", "Osaan suunnitella aikatauluni koeviikolle.", "Tiedän, keneltä voin pyytää apua koulussa."],
      sv: ["Jag vet hur jag lär mig bäst.", "Jag vet vad som gör mig motiverad i skolan.", "Jag kan nämna tre av mina styrkor.", "Jag kan planera mitt schema inför provveckan.", "Jag vet vem jag kan be om hjälp i skolan."],
      en: ["I know how I learn best.", "I know what makes me excited about school.", "I can name three of my strengths.", "I can plan my schedule for exam week.", "I know who I can ask for help at school."]
    },
    "8": {
      fi: ["Tunnen vaihtoehdot peruskoulun jälkeen (lukio, amis jne.).", "Tiedän, mitkä alat kiinnostavat minua ja miksi.", "Osaan etsiä koulutuksista tietoa Opintopolusta.", "Tiedän, miten haen TET-paikkaa ja mitä siellä tapahtuu.", "Uskon, että voin vaikuttaa omaan tulevaisuuteeni."],
      sv: ["Jag känner till alternativen efter grundskolan (gymnasium, yrkesskola osv.).", "Jag vet vilka branscher som intresserar mig och varför.", "Jag kan söka information om utbildningar på Studieinfo.", "Jag vet hur jag söker TET-plats och vad som händer där.", "Jag tror att jag kan påverka min egen framtid."],
      en: ["I know the options after comprehensive school (upper secondary, vocational school, etc.).", "I know which fields interest me and why.", "I can find information about programmes on Opintopolku.", "I know how to apply for a work experience placement and what happens there.", "I believe I can influence my own future."]
    },
    "9": {
      fi: ["Tiedän, miten yhteishaku toimii.", "Minulla on suunnitelma ja varasuunnitelma.", "Osaan vertailla vaihtoehtoja ja perustella valintani.", "Tiedän, mistä saan apua, jos suunnitelma ei toimi.", "Luotan siihen, että pärjään seuraavassa vaiheessa."],
      sv: ["Jag vet hur gemensam ansökan fungerar.", "Jag har en plan och en reservplan.", "Jag kan jämföra alternativ och motivera mitt val.", "Jag vet var jag får hjälp om planen inte fungerar.", "Jag litar på att jag klarar mig i nästa skede."],
      en: ["I know how the joint application works.", "I have a plan and a backup plan.", "I can compare options and explain my choice.", "I know where to get help if my plan doesn't work.", "I trust that I will do fine in the next stage."]
    }
  };

  var TEKSTIT = {
    fi: {
      otsikko: "Miten taitosi ovat kehittyneet?",
      ohje: "Palauta itsearviointilomake opolle. Vastaa omasta mielestäsi.",
      ala: "Valitse jokaiseen väitteeseen sopivin vaihtoehto.",
      ankkuri15: "1 = ei lainkaan totta · 5 = täysin totta",
      v6: "Kun vertaat lukuvuoden alkuun, miten taitosi ovat muuttuneet?",
      a6: "1 = paljon heikommat · 3 = ennallaan · 5 = paljon paremmat",
      nimi: "Nimesi", nimiPh: "Etunimi ja sukunimi",
      laheta: "Lataa ja palauta opolle Classroomin kautta",
      puuttuu: "Kirjoita nimesi ja vastaa kaikkiin kysymyksiin ensin.",
      ladattu: "Tiedosto on ladattu!",
      ohjeet: ["Avaa Google Classroom", "Liitä ladattu tiedosto itsearviointi-tehtävään", "Paina Palauta"],
      classroom: "Avaa Google Classroom",
      tiedosto: "Itsearviointi", pvm: "Päivämäärä", nimiRivi: "Nimi", luokkaRivi: "Luokka-aste",
      asteikko: "Asteikko 1–5 (1 = ei lainkaan totta, 5 = täysin totta)",
      muutos: "Muutos lukuvuoden alusta (1 = paljon heikommat, 5 = paljon paremmat)",
      lopetus: "Palautettu opettajalle Google Classroomin kautta."
    },
    sv: {
      otsikko: "Hur har dina färdigheter utvecklats?",
      ohje: "Lämna in självbedömningen till studiehandledaren. Svara utifrån din egen uppfattning.",
      ala: "Välj det alternativ som passar bäst för varje påstående.",
      ankkuri15: "1 = stämmer inte alls · 5 = stämmer helt",
      v6: "När du jämför med läsårets början, hur har dina färdigheter förändrats?",
      a6: "1 = mycket sämre · 3 = oförändrade · 5 = mycket bättre",
      nimi: "Ditt namn", nimiPh: "För- och efternamn",
      laheta: "Ladda ner och lämna in via Classroom",
      puuttuu: "Skriv ditt namn och svara på alla frågor först.",
      ladattu: "Filen har laddats ner!",
      ohjeet: ["Öppna Google Classroom", "Bifoga den nedladdade filen till uppgiften", "Tryck på Lämna in"],
      classroom: "Öppna Google Classroom",
      tiedosto: "Sjalvbedomning", pvm: "Datum", nimiRivi: "Namn", luokkaRivi: "Årskurs",
      asteikko: "Skala 1–5 (1 = stämmer inte alls, 5 = stämmer helt)",
      muutos: "Förändring sedan läsårets början (1 = mycket sämre, 5 = mycket bättre)",
      lopetus: "Inlämnad till studiehandledaren via Google Classroom."
    },
    en: {
      otsikko: "How have your skills developed?",
      ohje: "Return the self-assessment form to your guidance counsellor. Answer based on your own view.",
      ala: "Pick the best option for each statement.",
      ankkuri15: "1 = not true at all · 5 = completely true",
      v6: "Compared with the start of the school year, how have your skills changed?",
      a6: "1 = much weaker · 3 = the same · 5 = much better",
      nimi: "Your name", nimiPh: "First and last name",
      laheta: "Download and return via Classroom",
      puuttuu: "Please write your name and answer all questions first.",
      ladattu: "File downloaded!",
      ohjeet: ["Open Google Classroom", "Attach the downloaded file to the self-assessment assignment", "Press Turn in"],
      classroom: "Open Google Classroom",
      tiedosto: "Self-assessment", pvm: "Date", nimiRivi: "Name", luokkaRivi: "Grade",
      asteikko: "Scale 1–5 (1 = not true at all, 5 = completely true)",
      muutos: "Change since the start of the school year (1 = much weaker, 5 = much better)",
      lopetus: "Returned to the counsellor via Google Classroom."
    }
  };

  function kieli() { return TEKSTIT[KIELI] ? KIELI : "fi"; }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  var vastaukset = [0, 0, 0, 0, 0, 0];
  var nimi = "";
  var ladattu = false;

  function lisaaTyylit() {
    var st = document.createElement("style");
    st.textContent = [
      ".itsearv-kortti{max-width:820px;margin:0 auto;padding:1.4rem 1.3rem;background:var(--card);color:var(--text);border:2px solid var(--border);border-radius:1rem;box-shadow:0 4px 18px rgba(124,58,237,.10)}",
      ".itsearv-kortti h3{margin:0 0 .5rem;font-size:1.3rem;color:var(--primary)}",
      ".itsearv-ohje{margin:0 0 1rem;font-size:.95rem;line-height:1.5;color:var(--text-light)}",
      ".itsearv-ankkuri{font-size:.82rem;color:var(--text-light);margin:.1rem 0 .5rem}",
      ".itsearv-ryhma{border:0;border-top:1px solid var(--border);margin:0;padding:.85rem 0}",
      ".itsearv-ryhma legend{font-weight:600;line-height:1.4;padding:0;margin-bottom:.45rem;float:left;width:100%}",
      ".itsearv-ryhma legend+*{clear:both}",
      ".itsearv-valinnat{display:flex;gap:.5rem;flex-wrap:wrap}",
      ".itsearv-valinnat label{position:relative;flex:1 1 3rem;max-width:4.5rem;min-width:2.8rem}",
      ".itsearv-valinnat input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}",
      ".itsearv-valinnat span{display:flex;align-items:center;justify-content:center;min-height:2.8rem;border:2px solid var(--border);border-radius:.6rem;font-weight:700;font-size:1.05rem;background:#fff;color:var(--text)}",
      ".itsearv-valinnat input:hover+span{border-color:var(--primary)}",
      ".itsearv-valinnat input:checked+span{background:var(--primary);border-color:var(--primary);color:#fff}",
      ".itsearv-valinnat input:focus-visible+span{outline:3px solid #f59e0b;outline-offset:2px}",
      ".itsearv-nimi{display:block;font-weight:600;margin:.2rem 0 .35rem}",
      ".itsearv-nimi-kentta{width:100%;max-width:420px;box-sizing:border-box;padding:.65rem .8rem;font-size:1rem;border:2px solid var(--border);border-radius:.6rem;font-family:inherit}",
      ".itsearv-nimi-kentta:focus-visible{outline:3px solid #f59e0b;outline-offset:2px}",
      ".itsearv-laheta{margin-top:1rem;background:var(--primary);color:#fff;border:0;border-radius:.7rem;padding:.75rem 1.4rem;font-size:1rem;font-weight:700;cursor:pointer;font-family:inherit}",
      ".itsearv-laheta:hover{background:var(--primary-hover)}",
      ".itsearv-viesti{margin:.8rem 0 0;font-size:.95rem}",
      ".itsearv-viesti.virhe{color:#b91c1c}",
      ".itsearv-kiitos{font-size:1.05rem;font-weight:700;margin:.4rem 0 .6rem;color:#047857}",
      ".itsearv-askeleet{margin:0 0 1rem 1.2rem;padding:0;line-height:1.7}",
      ".itsearv-classroom{display:inline-block;background:#0f766e;color:#fff;border:0;border-radius:.7rem;padding:.75rem 1.4rem;font-size:1rem;font-weight:700;cursor:pointer;font-family:inherit;text-decoration:none}",
      ".itsearv-classroom:hover{background:#115e59}"
    ].join("");
    document.head.appendChild(st);
  }

  function lataaTiedosto() {
    var k = kieli(), T = TEKSTIT[k], V = VAITTEET[LUOKKA][k];
    var pvm = new Date().toLocaleDateString("fi-FI");
    var txt = T.tiedosto.toUpperCase() + " – " + LUOKKA + ". " + (k === "fi" ? "luokka" : T.luokkaRivi) + "\n================================\n\n";
    txt += T.nimiRivi + ": " + nimi + "\n" + T.pvm + ": " + pvm + "\n" + T.luokkaRivi + ": " + LUOKKA + "\n\n";
    txt += T.asteikko + "\n\n";
    for (var i = 0; i < 5; i++) txt += (i + 1) + ". " + V[i] + "\n   " + vastaukset[i] + " / 5\n\n";
    txt += T.muutos + "\n6. " + T.v6 + "\n   " + vastaukset[5] + " / 5\n\n";
    txt += "================================\n" + T.lopetus + "\n";
    var blob = new Blob(["\ufeff" + txt], { type: "text/plain;charset=utf-8" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = T.tiedosto + "_" + LUOKKA + "lk_" + nimi.replace(/[åä]/gi, "a").replace(/ö/gi, "o").replace(/\s+/g, "_").replace(/[^\w-]/g, "") + "_" + pvm.replace(/\./g, "-") + ".txt";
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { a.remove(); URL.revokeObjectURL(url); }, 1500);
  }

  function piirra() {
    var k = kieli(), T = TEKSTIT[k], V = VAITTEET[LUOKKA][k];
    var html = '<h3 class="itsearv-otsikko">' + esc(T.otsikko) + "</h3>";
    html += '<p class="itsearv-ohje">' + esc(T.ohje) + "</p>";
    if (ladattu) {
      html += '<p class="itsearv-kiitos" role="status">✓ ' + esc(T.ladattu) + "</p><ol class=\"itsearv-askeleet\">" +
        T.ohjeet.map(function (x) { return "<li>" + esc(x) + "</li>"; }).join("") + "</ol>" +
        '<a class="itsearv-classroom" href="https://classroom.google.com" target="_blank" rel="noopener">' + esc(T.classroom) + " ↗</a>";
      kortti.innerHTML = html;
      return;
    }
    html += '<p class="itsearv-ankkuri">' + esc(T.ala) + " " + esc(T.ankkuri15) + "</p>";
    html += '<form class="itsearv-lomake" novalidate>';
    html += '<label class="itsearv-nimi" for="itsearv-nimi">' + esc(T.nimi) + '</label>' +
      '<input class="itsearv-nimi-kentta" id="itsearv-nimi" type="text" autocomplete="name" maxlength="80" placeholder="' + esc(T.nimiPh) + '" value="' + esc(nimi) + '">';
    function ryhma(i, teksti, ankkuri) {
      var s = '<fieldset class="itsearv-ryhma"><legend>' + (i + 1) + ". " + esc(teksti) + "</legend>";
      if (ankkuri) s += '<div class="itsearv-ankkuri">' + esc(ankkuri) + "</div>";
      s += '<div class="itsearv-valinnat">';
      for (var n = 1; n <= 5; n++) {
        s += '<label><input type="radio" name="v' + i + '" value="' + n + '"' + (vastaukset[i] === n ? " checked" : "") +
          ' aria-label="' + n + '"><span aria-hidden="true">' + n + "</span></label>";
      }
      return s + "</div></fieldset>";
    }
    for (var i = 0; i < 5; i++) html += ryhma(i, V[i], null);
    html += ryhma(5, T.v6, T.a6);
    html += '<button type="submit" class="itsearv-laheta">⬇ ' + esc(T.laheta) + "</button>";
    html += '<p class="itsearv-viesti" role="status" aria-live="polite"></p></form>';
    kortti.innerHTML = html;

    var lomake = kortti.querySelector("form");
    var viesti = kortti.querySelector(".itsearv-viesti");
    lomake.addEventListener("input", function (e) {
      if (e.target.id === "itsearv-nimi") nimi = e.target.value;
    });
    lomake.addEventListener("change", function (e) {
      var m = /^v(\d)$/.exec(e.target.name || "");
      if (m) vastaukset[+m[1]] = +e.target.value;
    });
    lomake.addEventListener("submit", function (e) {
      e.preventDefault();
      nimi = nimi.trim();
      if (!nimi || vastaukset.some(function (x) { return !x; })) {
        viesti.className = "itsearv-viesti virhe";
        viesti.textContent = T.puuttuu;
        return;
      }
      lataaTiedosto();
      ladattu = true;
      piirra();
    });
  }

  lisaaTyylit();
  piirra();
})();
</script>
</body>
</html>
