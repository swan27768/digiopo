// Logiikka: pisteet per vaihtoehto (kieliriippumaton). Paras = suurin pistemäärä.
const META = [
  { points: [2, 0, 1] },
  { points: [0, 2, 1] },
  { points: [0, 2, 1] },
  { points: [0, 2, 1] },
  { points: [2, 0, 1] },
  { points: [0, 2, 1] }
];
const MASCOT = "../images/robo_maskotti_9lk.webp";
const TOTAL = META.length;
const MAXSCORE = META.reduce(function (a, m) { return a + Math.max.apply(null, m.points); }, 0);

function bestIndex(step) {
  var p = META[step].points, bi = 0;
  for (var i = 1; i < p.length; i++) if (p[i] > p[bi]) bi = i;
  return bi;
}

let view = 'cover';
let idx = 0;
let answered = false;
let choices = []; // choices[step] = valittu vaihtoehdon indeksi

function esc(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function nykyPisteet() {
  var sum = 0;
  for (var i = 0; i < choices.length; i++) {
    if (choices[i] !== undefined) sum += META[i].points[choices[i]];
  }
  return sum;
}

function paivitaProgress() {
  var fill = document.getElementById('progressFill');
  var label = document.getElementById('progressLabel');
  var wrap = document.getElementById('progressWrap');
  if (!fill || !label || !wrap) return;
  var pct = 0, txt = '';
  if (view === 'cover') { pct = 0; txt = T('cover.title'); }
  else if (view === 'step') { pct = Math.round((idx / (TOTAL + 1)) * 100); txt = T('step.tag') + ' ' + (idx + 1) + ' / ' + TOTAL; }
  else { pct = 100; txt = '✓'; }
  fill.style.width = pct + '%';
  label.textContent = txt;
  wrap.setAttribute('aria-valuenow', pct);
}

function render() {
  var stage = document.getElementById('stage');
  if (!stage) return;
  if (view === 'cover') renderCover(stage);
  else if (view === 'step') renderStep(stage);
  else renderResult(stage);
  paivitaProgress();
  stage.setAttribute('tabindex', '-1');
  try { stage.focus({ preventScroll: true }); } catch (e) { /* ignore */ }
}

function renderCover(stage) {
  var rules = T('cover.rules') || [];
  var lis = '';
  for (var i = 0; i < rules.length; i++) lis += '<li>' + esc(rules[i]) + '</li>';
  stage.innerHTML =
    '<div class="cover-card">' +
      '<div class="cover-badge">' + esc(T('cover.badge')) + '</div>' +
      '<img src="' + MASCOT + '" alt="Robo" style="width:100px;margin:0 auto 12px;display:block;" onerror="this.style.display=\'none\'" />' +
      '<h1>' + esc(T('cover.title')) + '</h1>' +
      '<p style="margin-bottom:12px;">' + esc(T('cover.lead')) + '</p>' +
      '<p style="font-weight:700;color:var(--color-primary);margin-bottom:6px;">' + esc(T('cover.rulesTitle')) + '</p>' +
      '<ul class="rule-list">' + lis + '</ul>' +
      '<div class="btn-row" style="justify-content:center;margin-top:18px;">' +
        '<button class="btn-primary" id="startBtn">' + esc(T('cover.start')) + '</button>' +
      '</div>' +
    '</div>';
  var s = document.getElementById('startBtn');
  if (s) s.onclick = function () { view = 'step'; idx = 0; answered = false; render(); };
}

function meterHtml() {
  var pct = MAXSCORE ? Math.round((nykyPisteet() / MAXSCORE) * 100) : 0;
  return '<div class="meter-wrap">' +
    '<div class="meter-label">📊 ' + esc(T('step.meter')) + ': ' + nykyPisteet() + ' / ' + MAXSCORE + '</div>' +
    '<div class="meter-bar"><div class="meter-fill" style="width:' + pct + '%"></div></div>' +
  '</div>';
}

function renderStep(stage) {
  var s = (T('steps') || [])[idx] || {};
  var letters = ['A', 'B', 'C', 'D'];
  var optsHtml = '';
  for (var i = 0; i < (s.options || []).length; i++) {
    optsHtml +=
      '<button class="opt-btn" data-opt="' + i + '">' +
        '<span class="opt-letter" aria-hidden="true">' + letters[i] + '</span>' +
        '<span>' + esc(s.options[i]) + '</span>' +
      '</button>';
  }
  stage.innerHTML =
    '<div class="card active">' +
      '<div class="chapter-tag">' + esc(T('cover.badge')) + ' · ' + esc(T('step.tag')) + ' ' + (idx + 1) + ' ' + esc(T('step.of')) + ' ' + TOTAL + '</div>' +
      meterHtml() +
      '<div class="robo-intro" style="margin-bottom:16px;">' +
        '<img src="' + MASCOT + '" alt="Robo" onerror="this.style.display=\'none\'" />' +
        '<div class="robo-bubble"><div class="robo-name-tag">' + esc(T('cover.roboName')) + '</div>' + esc(s.situation) + '</div>' +
      '</div>' +
      '<div class="options" id="optRow">' + optsHtml + '</div>' +
      '<div class="feedback" id="feedback"></div>' +
      '<div class="btn-row" id="nextRow" style="display:none;">' +
        '<button class="btn-primary" id="nextBtn">' + esc(idx === TOTAL - 1 ? T('step.last') : T('step.next')) + '</button>' +
      '</div>' +
    '</div>';

  var btns = stage.querySelectorAll('.opt-btn');
  for (var b = 0; b < btns.length; b++) {
    btns[b].onclick = function () { valitse(parseInt(this.getAttribute('data-opt'), 10)); };
  }
  var nb = document.getElementById('nextBtn');
  if (nb) nb.onclick = function () {
    if (idx < TOTAL - 1) { idx++; answered = false; render(); }
    else { view = 'result'; render(); }
  };

  if (choices[idx] !== undefined) { answered = true; naytaValinta(choices[idx], true); }
}

function valitse(oi) {
  if (answered) return;
  answered = true;
  choices[idx] = oi;
  naytaValinta(oi, false);
}

function naytaValinta(oi, hiljainen) {
  var s = (T('steps') || [])[idx] || {};
  var best = bestIndex(idx);
  var pisteet = META[idx].points[oi];
  var hyva = (pisteet === Math.max.apply(null, META[idx].points));
  var row = document.getElementById('optRow');
  var fb = document.getElementById('feedback');
  var nextRow = document.getElementById('nextRow');
  if (!row || !fb || !nextRow) return;

  var btns = row.querySelectorAll('.opt-btn');
  for (var i = 0; i < btns.length; i++) {
    btns[i].disabled = true;
    if (i === best) btns[i].classList.add('reveal-correct');
    if (i === oi && !hyva) btns[i].classList.add('reveal-wrong');
    if (i === oi) btns[i].classList.add('selected');
  }
  fb.className = 'feedback show ' + (hyva ? 'ok' : (pisteet === 0 ? 'fail' : 'info'));
  var txt = s.feedback[oi];
  if (!hyva) txt += ' — ' + T('step.bestWas') + ' ' + s.options[best];
  fb.textContent = txt;

  // Päivitä mittari valinnan jälkeen
  var mf = document.querySelector('.meter-fill');
  var ml = document.querySelector('.meter-label');
  if (mf) mf.style.width = (MAXSCORE ? Math.round((nykyPisteet() / MAXSCORE) * 100) : 0) + '%';
  if (ml) ml.textContent = '📊 ' + T('step.meter') + ': ' + nykyPisteet() + ' / ' + MAXSCORE;

  nextRow.style.display = 'flex';
}

function renderResult(stage) {
  var score = nykyPisteet();
  var gradeClass, gradeText;
  if (score >= 10) { gradeClass = 'erinomainen'; gradeText = T('result.gradeHigh'); }
  else if (score >= 6) { gradeClass = 'hyva'; gradeText = T('result.gradeMid'); }
  else { gradeClass = 'harjoitellaan'; gradeText = T('result.gradeLow'); }

  var steps = T('steps') || [];
  var review = '';
  for (var i = 0; i < TOTAL; i++) {
    var st = steps[i] || {};
    var oi = choices[i];
    var best = bestIndex(i);
    var hyva = oi !== undefined && META[i].points[oi] === Math.max.apply(null, META[i].points);
    review +=
      '<div class="review-item ' + (hyva ? 'ok' : 'fail') + '">' +
        '<div class="review-q">' + (hyva ? '✅' : '⚠️') + ' ' + esc(st.situation) + '</div>' +
        '<div style="font-size:0.85em;color:#555;">' + esc(T('result.yourChoice')) + ' ' + esc(oi !== undefined ? st.options[oi] : '–') + '</div>' +
        (hyva ? '' : '<div style="font-size:0.86em;color:#065f46;margin-top:3px;"><strong>' + esc(T('step.bestWas')) + '</strong> ' + esc(st.options[best]) + '</div>') +
      '</div>';
  }

  stage.innerHTML =
    '<div class="result-card show">' +
      '<div class="result-badge">' + esc(T('result.badge')) + '</div>' +
      '<img src="' + MASCOT + '" alt="Robo" style="width:80px;margin:0 auto 12px;display:block;" onerror="this.style.display=\'none\'" />' +
      '<div class="result-score">' + score + '</div>' +
      '<div class="result-max">' + esc(T('result.max')) + '</div>' +
      '<div class="result-grade ' + gradeClass + '">' + esc(gradeText) + '</div>' +
      '<div class="feedback info show" style="text-align:left;">' + esc(T('result.takeaway')) + '</div>' +
      '<div class="review-section"><h3>' + esc(T('result.reviewTitle')) + '</h3>' + review + '</div>' +
      '<div class="btn-row" style="justify-content:center;margin-top:20px;">' +
        '<button class="btn-primary" id="retryBtn">' + esc(T('result.retry')) + '</button>' +
        '<a href="' + esc(T('result.backHref')) + '"><button class="btn-primary btn-secondary">' + esc(T('result.back')) + '</button></a>' +
      '</div>' +
    '</div>';

  var rb = document.getElementById('retryBtn');
  if (rb) rb.onclick = function () { choices = []; idx = 0; answered = false; view = 'cover'; render(); };
}

TekoalyI18n.init({
  langs: ['fi', 'sv', 'en'],
  labels: { fi: 'FI', sv: 'SV', en: 'EN' },
  dict: LANG,
  barSelector: '#langBar',
  onChange: render
});
</script>
</body>
