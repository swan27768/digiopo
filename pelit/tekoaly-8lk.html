// Logiikka: onko kukin lähde AITO? (kieliriippumaton, indeksit vastaavat rounds[].sources)
const META = [
  { reals: [true, false, false] },
  { reals: [false, true, true] },
  { reals: [true, false, false] }
];
const MASCOT = "../images/robo_maskotti_8lk.webp";
const TOTAL = META.length;
const SRC_TOTAL = META.reduce(function (a, r) { return a + r.reals.length; }, 0);

let view = 'cover';
let idx = 0;
let picks = [];   // picks[round][srcIndex] = true(sanoi aito)/false(sanoi tekaistu)/undefined

function esc(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

function paivitaProgress() {
  var fill = document.getElementById('progressFill');
  var label = document.getElementById('progressLabel');
  var wrap = document.getElementById('progressWrap');
  if (!fill || !label || !wrap) return;
  var pct = 0, txt = '';
  if (view === 'cover') { pct = 0; txt = T('cover.title'); }
  else if (view === 'round') { pct = Math.round((idx / (TOTAL + 1)) * 100); txt = T('round.progress') + ' ' + (idx + 1) + ' / ' + TOTAL; }
  else { pct = 100; txt = '✓'; }
  fill.style.width = pct + '%';
  label.textContent = txt;
  wrap.setAttribute('aria-valuenow', pct);
}

function render() {
  var stage = document.getElementById('stage');
  if (!stage) return;
  if (view === 'cover') renderCover(stage);
  else if (view === 'round') renderRound(stage);
  else renderResult(stage);
  paivitaProgress();
  stage.setAttribute('tabindex', '-1');
  try { stage.focus({ preventScroll: true }); } catch (e) { /* ignore */ }
}

function renderCover(stage) {
  var rules = T('cover.rules') || [];
  var lis = '';
  for (var i = 0; i < rules.length; i++) lis += '<li>' + esc(rules[i]) + '</li>';
  stage.innerHTML =
    '<div class="cover-card">' +
      '<div class="cover-badge">' + esc(T('cover.badge')) + '</div>' +
      '<img src="' + MASCOT + '" alt="Robo" style="width:100px;margin:0 auto 12px;display:block;" onerror="this.style.display=\'none\'" />' +
      '<h1>' + esc(T('cover.title')) + '</h1>' +
      '<p style="margin-bottom:12px;">' + esc(T('cover.lead')) + '</p>' +
      '<p style="font-weight:700;color:var(--color-primary);margin-bottom:6px;">' + esc(T('cover.rulesTitle')) + '</p>' +
      '<ul class="rule-list">' + lis + '</ul>' +
      '<div class="btn-row" style="justify-content:center;margin-top:18px;">' +
        '<button class="btn-primary" id="startBtn">' + esc(T('cover.start')) + '</button>' +
      '</div>' +
    '</div>';
  var s = document.getElementById('startBtn');
  if (s) s.onclick = function () { view = 'round'; idx = 0; render(); };
}

function renderRound(stage) {
  var r = (T('rounds') || [])[idx] || {};
  var reals = META[idx].reals;
  if (!picks[idx]) picks[idx] = [];
  var srcHtml = '';
  for (var i = 0; i < (r.sources || []).length; i++) {
    srcHtml +=
      '<div class="card active" style="display:block;margin-bottom:12px;box-shadow:2px 2px 0 #000;padding:12px 14px;" data-src="' + i + '">' +
        '<div style="font-weight:700;margin-bottom:8px;">📄 ' + esc(r.sources[i].text) + '</div>' +
        '<div class="choice-row">' +
          '<button class="choice-btn" data-src="' + i + '" data-pick="real">' + esc(T('round.real')) + '</button>' +
          '<button class="choice-btn" data-src="' + i + '" data-pick="fake">' + esc(T('round.fake')) + '</button>' +
        '</div>' +
        '<div class="feedback" data-fb="' + i + '"></div>' +
      '</div>';
  }
  stage.innerHTML =
    '<div class="card active">' +
      '<div class="chapter-tag">' + esc(T('cover.badge')) + ' · ' + esc(T('round.tag')) + ' ' + (idx + 1) + ' ' + esc(T('round.of')) + ' ' + TOTAL + '</div>' +
      '<p class="q-meta">' + esc(T('round.questionLabel')) + ' <strong>' + esc(r.question) + '</strong></p>' +
      '<div class="ai-answer"><span class="ai-tag">🤖 ' + esc(T('round.aiTag')) + '</span><div>' + esc(r.ai) + '</div></div>' +
      '<h2 style="font-size:1em;">' + esc(T('round.sourcesTitle')) + '</h2>' +
      srcHtml +
      '<div class="btn-row" id="nextRow" style="display:none;">' +
        '<button class="btn-primary" id="nextBtn">' + esc(idx === TOTAL - 1 ? T('round.last') : T('round.next')) + '</button>' +
      '</div>' +
    '</div>';

  var btns = stage.querySelectorAll('.choice-btn');
  for (var b = 0; b < btns.length; b++) {
    btns[b].onclick = function () {
      var si = parseInt(this.getAttribute('data-src'), 10);
      var sanoiAito = this.getAttribute('data-pick') === 'real';
      arvioiLahde(si, sanoiAito);
    };
  }
  var nb = document.getElementById('nextBtn');
  if (nb) nb.onclick = function () {
    if (idx < TOTAL - 1) { idx++; render(); }
    else { view = 'result'; render(); }
  };

  // Palauta jo tehdyt valinnat (kielenvaihto kesken kierroksen)
  for (var k = 0; k < picks[idx].length; k++) {
    if (picks[idx][k] !== undefined) naytaLahde(k, picks[idx][k], true);
  }
  tarkistaValmis();
}

function arvioiLahde(si, sanoiAito) {
  if (picks[idx][si] !== undefined) return;
  picks[idx][si] = sanoiAito;
  naytaLahde(si, sanoiAito, false);
  tarkistaValmis();
}

function naytaLahde(si, sanoiAito, hiljainen) {
  var r = (T('rounds') || [])[idx] || {};
  var aito = META[idx].reals[si];
  var oikein = (sanoiAito === aito);
  var wrapper = document.querySelector('.card[data-src="' + si + '"]');
  if (!wrapper) return;
  var btns = wrapper.querySelectorAll('.choice-btn');
  for (var i = 0; i < btns.length; i++) {
    var pickReal = btns[i].getAttribute('data-pick') === 'real';
    btns[i].disabled = true;
    if (pickReal === aito) btns[i].classList.add('correct');
    if (pickReal === sanoiAito && !oikein) btns[i].classList.add('wrong');
    if (pickReal === sanoiAito) btns[i].classList.add('chosen');
  }
  var fb = wrapper.querySelector('[data-fb="' + si + '"]');
  if (fb) {
    fb.className = 'feedback show ' + (oikein ? 'ok' : 'fail');
    var otsikko = aito ? T('round.revealReal') : T('round.revealFake');
    fb.innerHTML = '<strong>' + (oikein ? '✅ ' : '❌ ') + esc(otsikko) + '.</strong> ' + esc(r.sources[si].tell);
  }
}

function tarkistaValmis() {
  var reals = META[idx].reals;
  var kaikki = true;
  for (var i = 0; i < reals.length; i++) {
    if (picks[idx][i] === undefined) { kaikki = false; break; }
  }
  var nextRow = document.getElementById('nextRow');
  if (nextRow) nextRow.style.display = kaikki ? 'flex' : 'none';
}

function renderResult(stage) {
  var oikeat = 0;
  for (var ri = 0; ri < TOTAL; ri++) {
    for (var si = 0; si < META[ri].reals.length; si++) {
      if (picks[ri] && picks[ri][si] === META[ri].reals[si]) oikeat++;
    }
  }
  var gradeClass, gradeText;
  if (oikeat >= 8) { gradeClass = 'erinomainen'; gradeText = T('result.gradeHigh'); }
  else if (oikeat >= 5) { gradeClass = 'hyva'; gradeText = T('result.gradeMid'); }
  else { gradeClass = 'harjoitellaan'; gradeText = T('result.gradeLow'); }

  var rounds = T('rounds') || [];
  var review = '';
  for (var r = 0; r < TOTAL; r++) {
    var rd = rounds[r] || {};
    for (var s = 0; s < META[r].reals.length; s++) {
      var aito = META[r].reals[s];
      var ok = picks[r] && picks[r][s] === aito;
      review +=
        '<div class="review-item ' + (ok ? 'ok' : 'fail') + '">' +
          '<div class="review-q">' + (ok ? '✅' : '❌') + ' ' + esc((rd.sources[s] || {}).text) + '</div>' +
          '<div style="font-size:0.88em;color:#333;">' + esc((rd.sources[s] || {}).tell) + '</div>' +
        '</div>';
    }
  }

  stage.innerHTML =
    '<div class="result-card show">' +
      '<div class="result-badge">' + esc(T('result.badge')) + '</div>' +
      '<img src="' + MASCOT + '" alt="Robo" style="width:80px;margin:0 auto 12px;display:block;" onerror="this.style.display=\'none\'" />' +
      '<div class="result-score">' + oikeat + '</div>' +
      '<div class="result-max">' + esc(T('result.max')) + '</div>' +
      '<div class="result-grade ' + gradeClass + '">' + esc(gradeText) + '</div>' +
      '<div class="feedback info show" style="text-align:left;">' + esc(T('result.takeaway')) + '</div>' +
      '<div class="review-section"><h3>' + esc(T('result.reviewTitle')) + '</h3>' + review + '</div>' +
      '<div class="btn-row" style="justify-content:center;margin-top:20px;">' +
        '<button class="btn-primary" id="retryBtn">' + esc(T('result.retry')) + '</button>' +
        '<a href="' + esc(T('result.backHref')) + '"><button class="btn-primary btn-secondary">' + esc(T('result.back')) + '</button></a>' +
      '</div>' +
    '</div>';

  var rb = document.getElementById('retryBtn');
  if (rb) rb.onclick = function () { picks = []; idx = 0; view = 'cover'; render(); };
}

TekoalyI18n.init({
  langs: ['fi', 'sv', 'en'],
  labels: { fi: 'FI', sv: 'SV', en: 'EN' },
  dict: LANG,
  barSelector: '#langBar',
  onChange: render
});
</script>
</body>
