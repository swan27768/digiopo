<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reppu – 9. luokka</title>
  <link rel="stylesheet" href="/vendor/fonts/fonts.css">
  <style>
    :root {
      --bg:     #f6f7fb;
      --card:   #ffffff;
      --accent: #d62b52;
      --gold:   #a85f00;
      --teal:   #00796a;
      --purple: #6b46c1;
      --blue:   #0a6fc2;
      --text:   #1f2340;
      --muted:  #5b6082;
      --border: rgba(31,35,64,0.14);
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin:0; padding:0; background:var(--bg); color:var(--text);
      font-family:'Nunito',sans-serif; min-height:100vh; }
    #app { display:flex; justify-content:center; min-height:100vh; padding:1rem; }
    .screen { width:100%; max-width:700px; padding:1.5rem 1rem 5rem;
      display:flex; flex-direction:column; align-items:center; }

    /* Progress */
    .pbar { width:100%; max-width:500px; height:8px;
      background:rgba(31,35,64,0.10); border-radius:99px; margin-bottom:1.5rem; overflow:hidden; }
    .pfill { height:100%; background:linear-gradient(90deg,var(--accent),#e8870e);
      border-radius:99px; transition:width .4s ease; }
    .step-label { font-size:.8rem; color:var(--muted); text-align:center;
      margin-bottom:.4rem; letter-spacing:.04em; text-transform:uppercase; }

    /* Typography */
    h1 { font-family:'Space Grotesk',sans-serif; font-size:2rem; font-weight:700;
      color:var(--accent); text-align:center; margin:.4rem 0 .8rem; }
    h2 { font-family:'Space Grotesk',sans-serif; font-size:1.3rem; font-weight:700;
      color:var(--gold); text-align:center; margin:.4rem 0 .6rem; }
    h3 { font-size:1rem; font-weight:700; color:var(--text); text-align:center; margin:.4rem 0 .5rem; }

    /* Cards */
    .card { background:var(--card); border:1px solid var(--border); border-radius:16px;
      padding:1rem 1.2rem; margin:.4rem 0; width:100%; line-height:1.7; }
    .card-info { background:rgba(0,121,106,.07); border:1px solid rgba(0,121,106,.25);
      border-radius:12px; padding:.7rem 1rem; font-size:.9rem; color:var(--teal);
      margin:.4rem 0; width:100%; }

    /* Buttons */
    .btn { display:block; width:100%; padding:.75rem 1rem;
      background:var(--card); border:2px solid var(--border); border-radius:14px;
      color:var(--text); font-family:'Nunito',sans-serif; font-size:.97rem; font-weight:600;
      text-align:left; cursor:pointer; transition:border-color .15s,background .15s,transform .15s; line-height:1.4; }
    .btn:hover { border-color:var(--accent); background:rgba(214,43,82,.1); transform:translateX(3px); }
    .btn-primary { background:var(--accent); border-color:var(--accent); color:#fff;
      text-align:center; font-weight:800; font-size:1rem; }
    .btn-primary:hover { background:#b8203f; border-color:#b8203f; transform:translateY(-2px); }
    .btn-ghost { background:transparent; border-color:rgba(31,35,64,.14);
      color:var(--muted); text-align:center; }
    .btn-ghost:hover { border-color:var(--teal); color:var(--teal); transform:none; }
    .btn-group { display:flex; flex-direction:column; gap:.5rem; width:100%; margin:.8rem 0; }

    .card, .btn, .type-card, .area-section, .cv-step { box-shadow:0 1px 3px rgba(20,20,60,.07); }
    .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
    [tabindex="-1"]:focus { outline:none; }
    /* Cover */
    .cover { text-align:center; padding:2rem 0 1rem; width:100%; }
    .cover-logo { font-family:'Space Grotesk',sans-serif; font-size:2.5rem; font-weight:700;
      color:var(--accent); line-height:1.1; }
    .cover-sub { color:var(--muted); font-size:1rem; margin:.8rem 0 1.5rem; line-height:1.6; }

    /* Phase badge */
    .phase-badge { display:inline-block; background:rgba(107,70,193,.2);
      border:1px solid var(--purple); color:#6b46c1; border-radius:99px;
      padding:.2rem .9rem; font-size:.8rem; font-weight:700;
      letter-spacing:.04em; margin-bottom:.8rem; }

    /* Type grid */
    .type-grid { display:grid; grid-template-columns:1fr 1fr 1fr; gap:.55rem; width:100%; margin:.8rem 0; }
    @media(max-width:520px){ .type-grid { grid-template-columns:1fr 1fr; } }
    .type-card { background:var(--card); border:2px solid var(--border); border-radius:14px;
      padding:.85rem .6rem; cursor:pointer; text-align:center;
      font-family:'Nunito',sans-serif; font-weight:700; font-size:.88rem; color:var(--text);
      transition:border-color .15s,background .15s; user-select:none; }
    .type-card:hover { border-color:var(--gold); background:rgba(168,95,0,.08); }
    .type-card.selected { border-color:var(--teal); background:rgba(0,121,106,.1); color:var(--teal); }
    .type-card .tc-emoji { font-size:1.6rem; display:block; margin-bottom:.3rem; }

    /* Strength chips (selectable) */
    .chips-wrap { display:flex; flex-wrap:wrap; gap:.45rem; margin:.5rem 0; width:100%; }
    .chip { display:inline-flex; align-items:center; gap:.3rem;
      background:rgba(168,95,0,.1); border:1.5px solid rgba(168,95,0,.35);
      color:var(--gold); border-radius:99px; padding:.25rem .75rem;
      font-size:.85rem; font-weight:700; cursor:pointer;
      transition:background .15s,border-color .15s,transform .1s; user-select:none; }
    .chip:hover { background:rgba(168,95,0,.2); transform:scale(1.04); }
    .chip.on { background:var(--gold); color:#fff; border-color:var(--gold); }
    .chip.teal { background:rgba(0,121,106,.1); border-color:rgba(0,121,106,.35); color:var(--teal); }
    .chip.teal.on { background:var(--teal); color:#fff; border-color:var(--teal); }

    /* Area sections (vahvuusmatka) */
    .area-section { width:100%; background:var(--card); border:1px solid var(--border);
      border-radius:16px; padding:.9rem 1.1rem; margin:.4rem 0; }
    .area-title { font-size:.98rem; font-weight:800; color:var(--text); margin-bottom:.6rem; }

    /* ── REPPU SCREEN ── */
    .reppu-layout { display:flex; gap:1.2rem; width:100%; margin-top:.5rem; align-items:flex-start; }
    @media(max-width:580px){ .reppu-layout { flex-direction:column; } }

    .pool-panel { flex:1; min-width:0; }
    .pool-panel h3 { text-align:left; color:var(--gold); font-size:1rem; margin-bottom:.6rem; }
    .pool-chip { display:inline-flex; align-items:center;
      background:rgba(168,95,0,.12); border:1.5px solid var(--gold);
      color:var(--gold); border-radius:10px; padding:.4rem .85rem;
      font-size:.87rem; font-weight:700; margin:.25rem .2rem;
      cursor:grab; user-select:none; transition:opacity .15s,transform .1s; }
    .pool-chip:active { cursor:grabbing; transform:scale(1.06); }
    .pool-chip.used { opacity:.3; cursor:default; pointer-events:none; }
    .pool-chip.dragging { opacity:.4; }

    /* Backpack */
    .bag-panel { flex:0 0 240px; display:flex; flex-direction:column; align-items:center; }
    @media(max-width:580px){ .bag-panel { flex:none; width:100%; } }

    .bag-svg-wrap { position:relative; width:200px; margin:0 auto; }
    .bag-svg-wrap svg { width:100%; height:auto; display:block; }

    .bag-counter { font-family:'Space Grotesk',sans-serif; font-size:1.1rem; font-weight:700;
      color:var(--text); text-align:center; margin:.5rem 0 .3rem; }
    .bag-counter span { color:var(--gold); }

    .slots-list { display:flex; flex-direction:column; gap:.4rem; width:100%; margin-top:.4rem; }
    .slot { min-height:46px; border:2px dashed rgba(168,95,0,.35); border-radius:12px;
      padding:.35rem .7rem; display:flex; align-items:center; justify-content:space-between;
      background:rgba(168,95,0,.04); transition:background .2s,border-color .2s; position:relative; }
    .slot.over { border-color:var(--teal); background:rgba(0,121,106,.1); }
    .slot.filled { border-style:solid; border-color:var(--gold); background:rgba(168,95,0,.12); }
    .slot-num { font-size:.75rem; color:var(--muted); font-weight:700; margin-right:.5rem; flex-shrink:0; }
    .slot-content { font-size:.88rem; font-weight:700; color:var(--gold); flex:1; }
    .slot-remove { background:none; border:none; color:var(--muted); font-size:1rem;
      cursor:pointer; padding:0 .2rem; line-height:1; border-radius:4px; }
    .slot-remove:hover { color:var(--accent); }
    .slot-remove:focus-visible { outline:2px solid var(--accent); }

    /* Focus styles for keyboard nav */
    .type-card:focus-visible { outline:2px solid var(--teal); outline-offset:2px; }
    .chip:focus-visible { outline:2px solid var(--gold); outline-offset:2px; }
    .pool-chip:focus-visible { outline:2px solid var(--teal); outline-offset:2px; }
    .btn:focus-visible { outline:2px solid var(--teal); outline-offset:2px; }

    /* PDF Preview Modal */
    .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,.75);
      display:flex; align-items:center; justify-content:center; z-index:1000;
      padding:1rem; }
    .modal-box { background:#fff; color:#1a1a2e; border-radius:16px;
      width:100%; max-width:660px; max-height:85vh; overflow-y:auto;
      padding:2rem 2.5rem; position:relative; }
    .modal-close { position:absolute; top:1rem; right:1rem; background:none;
      border:1px solid #ccc; border-radius:8px; font-size:1rem; cursor:pointer;
      padding:.3rem .7rem; color:#555; }
    .modal-close:hover { background:#f0f0f0; }
    .modal-actions { display:flex; gap:.7rem; margin-top:1.5rem; justify-content:flex-end; }
    .modal-btn { padding:.6rem 1.3rem; border-radius:10px; font-family:'Nunito',sans-serif;
      font-weight:700; font-size:.95rem; cursor:pointer; border:none; }
    .modal-btn-print { background:#d62b52; color:#fff; }
    .modal-btn-print:hover { background:#b8203f; }
    .modal-btn-cancel { background:#eee; color:#333; }
    .modal-btn-cancel:hover { background:#ddd; }

    /* CV preview styles (inside modal) */
    .cv-preview h1 { font-family:Georgia,serif; font-size:1.8rem; color:#1a1a2e;
      margin-bottom:.15rem; text-align:left; }
    .cv-preview .cv-sub { color:#666; font-size:.88rem; margin-bottom:1.2rem; }
    .cv-preview h2 { font-family:Georgia,serif; font-size:.9rem; text-transform:uppercase;
      letter-spacing:.08em; color:#c87c20; border-bottom:2px solid #c87c20;
      padding-bottom:.2rem; margin:1.2rem 0 .4rem; text-align:left; }
    .cv-preview p { font-family:Georgia,serif; font-size:.95rem; line-height:1.65;
      color:#1a1a2e; margin:.2rem 0; }
    .cv-preview .cv-chip { display:inline-block; background:#fff3d9;
      border:1.5px solid #c87c20; color:#7c5010; border-radius:99px;
      padding:.1rem .65rem; font-size:.82rem; font-weight:700; margin:.15rem .1rem; }
    .slot-empty { font-size:.8rem; color:rgba(31,35,64,.4); font-style:italic; }

    /* Completion */
    .bag-done { text-align:center; }
    .bag-done .bigmoji { font-size:3.5rem; display:block; margin:.5rem 0; }
    .packed-list { display:flex; flex-wrap:wrap; gap:.4rem; justify-content:center;
      margin:.8rem 0; }
    .packed-tag { background:var(--gold); color:#fff; border-radius:99px;
      padding:.3rem .9rem; font-size:.9rem; font-weight:800; }

    /* CV screen */
    .cv-step { background:var(--card); border:1px solid var(--border); border-radius:16px;
      padding:1rem 1.2rem; margin:.4rem 0; width:100%; }
    .cv-step-num { display:inline-block; background:var(--accent); color:#fff;
      border-radius:99px; width:1.6rem; height:1.6rem; line-height:1.6rem;
      text-align:center; font-weight:800; font-size:.85rem; margin-right:.5rem; flex-shrink:0; }
    .cv-step-title { font-weight:800; color:var(--text); font-size:.98rem; }
    .cv-step-body { color:var(--muted); font-size:.9rem; margin:.4rem 0 0 2.1rem; line-height:1.6; }
    .cv-header { display:flex; align-items:center; margin-bottom:.1rem; }

    .cv-fields { display:grid; grid-template-columns:1fr 1fr; gap:.6rem; margin-top:.7rem; }
    @media(max-width:520px){ .cv-fields { grid-template-columns:1fr; } }
    .cv-label { display:block; font-size:.8rem; font-weight:700; color:var(--muted); }
    .cv-input { display:block; width:100%; margin-top:.25rem; background:#ffffff;
      border:1px solid rgba(31,35,64,.2); border-radius:10px; color:var(--text);
      font-family:'Nunito',sans-serif; font-size:.92rem; padding:.5rem .7rem; }
    .cv-input:focus { outline:2px solid var(--teal); border-color:var(--teal); }

    /* Kiinteä laskuripalkki (vain Reppu-vaihe, vain pieni näyttö) */
    .bag-bar { display:none; }
    @media (max-width:580px){
      .bag-bar:not([hidden]) { display:flex; align-items:center; justify-content:space-between; gap:.8rem;
        position:fixed; left:0; right:0; bottom:0; z-index:90;
        padding:.6rem 1rem calc(.6rem + env(safe-area-inset-bottom));
        background:rgba(255,255,255,.97); backdrop-filter:blur(8px);
        border-top:1px solid rgba(168,95,0,.55); }
    }
    .bag-bar-count { font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:1rem; color:var(--text); white-space:nowrap; }
    .bag-bar-count strong { color:var(--gold); }
    .bag-bar-dots { display:flex; gap:.3rem; margin-top:.25rem; }
    .bag-bar-dot { width:.65rem; height:.65rem; border-radius:50%; border:1.5px solid var(--gold); background:transparent; }
    .bag-bar-dot.on { background:var(--gold); }
    .bag-bar.full .bag-bar-count strong { color:var(--teal); }
    .bag-bar.full .bag-bar-dot { border-color:var(--teal); }
    .bag-bar.full .bag-bar-dot.on { background:var(--teal); }
    .bag-bar-btn { min-height:44px; padding:.5rem 1.1rem; border:none; border-radius:12px; background:var(--accent);
      color:#fff; font-family:'Nunito',sans-serif; font-weight:800; font-size:.95rem; cursor:pointer; white-space:nowrap; }

    /* Isommat kosketuskohteet ja 16 px kentät (estää iPhonen automaattisen zoomauksen) */
    input, textarea, select { font-size:16px !important; }
    input[type=text], input[type=email], input[type=tel], select { min-height:44px; }
    .chip, .pool-chip { min-height:44px; }
    .add-btn { min-height:44px; min-width:44px; }
    .slot-remove { min-width:44px; min-height:44px; font-size:1.1rem; }
    .modal-btn, .modal-close { min-height:44px; }
    /* ✓ valitun vahvuuden eteen (ei vain väri) */
    .chip.on:not(.custom):not(.static)::before { content:"✓ "; content:"✓ " / ""; margin-right:.15rem; }
    /* Linkki 8. luokan Vahvuusmatkaan */
    .task-link-box { width:100%; margin:.4rem 0; padding:.7rem 1rem; border-radius:12px;
      background:rgba(107,70,193,.1); border:1px solid rgba(107,70,193,.35);
      font-size:.92rem; line-height:1.6; color:var(--text); }
    .task-link { display:inline-flex; align-items:center; min-height:44px; margin-top:.2rem;
      color:var(--teal); font-weight:800; text-decoration:underline; text-underline-offset:3px; }
    .task-link:hover { color:var(--accent); }
    .task-link:focus-visible { outline:2px solid var(--teal); outline-offset:3px; border-radius:6px; }

    /* Sanojen selitykset */
    .hints { width:100%; margin-top:.4rem; font-size:.88rem; color:var(--muted); text-align:left; }
    .hints summary { cursor:pointer; color:var(--teal); font-weight:700; min-height:44px;
      display:flex; align-items:center; }
    .hints ul { margin:.1rem 0 .4rem; padding-left:1.1rem; line-height:1.65; }
    .hints li strong { color:var(--text); }

    .opt-tag { display:inline-block; margin-left:.5rem; padding:.05rem .6rem; border-radius:99px;
      border:1px solid var(--purple); color:#6b46c1; font-size:.72rem; font-weight:700;
      letter-spacing:.03em; vertical-align:middle; }
    select.cv-input { cursor:pointer; }

    .bigmoji { font-size:3rem; display:block; text-align:center; margin:.5rem 0; }
    textarea { width:100%; background:#ffffff; border:1px solid rgba(31,35,64,.2);
      border-radius:10px; color:var(--text); font-family:'Nunito',sans-serif;
      font-size:.92rem; padding:.6rem .8rem; resize:vertical; min-height:80px; line-height:1.5; }
    textarea:focus { outline:2px solid var(--teal); border-color:var(--teal); }
    textarea::placeholder { color:var(--muted); }

    .example-box { background:rgba(107,70,193,.08); border:1px solid rgba(107,70,193,.25);
      border-radius:10px; padding:.6rem .9rem; font-size:.85rem; color:#5b3aa8;
      margin:.4rem 0; font-style:italic; }

    /* Brand logo */
    .brand-bar { position:fixed; top:0; left:0; right:0; z-index:100;
      padding:.5rem 1rem; display:flex; align-items:center; gap:.4rem;
      background:rgba(246,247,251,.92); backdrop-filter:blur(8px);
      border-bottom:1px solid rgba(31,35,64,.08); pointer-events:none; }
    .brand-digi { font-family:'Space Grotesk',sans-serif; font-size:.85rem;
      font-weight:800; color:#6b46c1; letter-spacing:-.02em; }
    .brand-opo  { font-family:'Space Grotesk',sans-serif; font-size:.85rem;
      font-weight:400; color:rgba(107,70,193,.5); }
    .brand-dot  { color:rgba(107,70,193,.25); font-size:.8rem; margin:0 .2rem; }
    .brand-label { font-size:.72rem; color:rgba(107,70,193,.45);
      letter-spacing:.1em; text-transform:uppercase; font-weight:500; }
    .brand-year { font-size:.72rem; color:rgba(107,70,193,.3);
      letter-spacing:.06em; font-weight:500; }
    /* push content below fixed bar */
    #app { padding-top:3rem; }
    /* Puhekupla: joku kysyy oppilaalta */
    .kupla {
      position: relative;
      width: 100%;
      background: #e6f4f1;
      border: 1.5px solid rgba(0,121,106,0.4);
      border-radius: 20px 20px 20px 4px;
      padding: 0.9rem 1.2rem;
      margin: 0.6rem 0 1.6rem;
      color: #00604f;
      font-size: 1rem; font-weight: 600; line-height: 1.55;
    }
    .kupla::before, .kupla::after {
      content: ""; position: absolute; left: 22px; width: 0; height: 0;
      border-style: solid;
    }
    .kupla::before {
      bottom: -15px;
      border-width: 15px 0 0 18px;
      border-color: rgba(0,121,106,0.4) transparent transparent transparent;
    }
    .kupla::after {
      bottom: -12px; left: 24px;
      border-width: 13px 0 0 15px;
      border-color: #e6f4f1 transparent transparent transparent;
    }
    /* Kupla + robo. Kapealla: kupla ja robo sen alla. Leveällä: kortti | kupla | robo */
    .intro-rivi { width: 100%; display: flex; flex-direction: column; }
    .puhe { display: flex; flex-direction: column; }
    .robo { width: 110px; height: auto; align-self: flex-start; margin: -0.6rem 0 0 0.6rem; }
    @media (min-width: 720px) {
      .screen:has(.intro-rivi) { max-width: 980px; }
      .intro-rivi { flex-direction: row; align-items: flex-start; gap: 1.6rem; }
      .intro-rivi .card { flex: 1.2; margin: 0.6rem 0; }
      .puhe { flex: 1.35; flex-direction: row; align-items: flex-start; gap: 1.6rem; }
      .puhe .kupla {
        flex: 1; margin: 1.4rem 0 0.6rem;
        border-radius: 20px 4px 20px 20px;
      }
      .puhe .kupla::before, .puhe .kupla::after { bottom: auto; left: auto; }
      .puhe .kupla::before {
        top: 14px; right: -17px;
        border-width: 10px 0 10px 17px;
        border-color: transparent transparent transparent rgba(0,121,106,0.4);
      }
      .puhe .kupla::after {
        top: 16px; right: -14px;
        border-width: 8px 0 8px 14px;
        border-color: transparent transparent transparent #e6f4f1;
      }
      .robo { width: 150px; margin: 0; align-self: flex-end; }
    }

    .tyyppi-huom { width:100%; margin:.2rem 0 .4rem; text-align:center; font-size:.88rem; color:var(--muted); }
    .alku-ala { grid-area: nappi; width:100%; max-width:560px; display:flex; flex-direction:column; align-items:center; margin-top:.8rem; }
    .alku-ala .alku-nappi { margin-top:.8rem; }
    /* Etusivu */
    .alku {
      position: relative; width: 100%; isolation: isolate;
      display: grid; gap: 0.6rem 1rem; align-items: end; justify-items: center;
      grid-template-columns: 1fr 1fr;
      grid-template-areas: "teksti teksti" "l r" "nappi nappi";
      padding: 1.2rem 0 1rem;
    }
    .alku::before {
      content: ""; position: absolute; z-index: -1; inset: -5rem -3rem -4rem;
      background:
        radial-gradient(ellipse 30% 34% at 50% 38%, rgba(214,43,82,0.13), transparent 100%),
        radial-gradient(ellipse 22% 30% at 20% 80%, rgba(232,135,14,0.17), transparent 100%),
        radial-gradient(ellipse 22% 30% at 80% 80%, rgba(107,70,193,0.13), transparent 100%);
      pointer-events: none;
    }
    .alku-teksti { grid-area: teksti; text-align: center; padding-top: 0.8rem; }
    .alku-nappi  { grid-area: nappi; width: 100%; max-width: 360px; margin-top: 0.8rem; }
    .alku-hahmo--l { grid-area: l; } .alku-hahmo--r { grid-area: r; }
    .alku-hahmo { position: relative; line-height: 0; }
    .alku-hahmo img { width: 118px; height: auto; position: relative; animation: alku-keinu 4s ease-in-out infinite; }
    .alku-hahmo--r img { animation-delay: -2s; }
    .alku-hahmo::after {
      content: ""; position: absolute; left: 50%; bottom: -6px; width: 78%; height: 14px; transform: translateX(-50%);
      background: radial-gradient(ellipse at center, rgba(31,35,64,0.22), transparent 70%);

<script>
// ── STATE ─────────────────────────────────────────────────────────────────────

// ── DATA ──────────────────────────────────────────────────────────────────────
const SV_TYPES = {

  'Ajattelija': { emoji:'🔬', color:'#0a6fc2', chips:['analyyttinen','järjestelmällinen','utelias','harkitseva','ratkaisuhakuinen','tarkkaavainen'] },
  'Auttaja':    { emoji:'🤝', color:'#00796a', chips:['avulias','empaattinen','kuunteleva','yhteisöllinen','yhteistyökykyinen','luotettava'] },

const VM_AREAS = [
  { id:'innostus',       label:'😊 Kun olen innostunut', chips:['innostuva','energinen','sitkeä','luova','rohkea','sinnikäs'] },

  { id:'oppiminen',      label:'📚 Kun opin uutta', chips:['utelias','tarkkaavainen','oppimishaluinen','järjestelmällinen','kärsivällinen','hyvä muisti'] },

// ── LINKKI 8. LUOKAN VAHVUUSMATKAAN ──────────────────────────────────────────

// ── SANOJEN SELITYKSET ───────────────────────────────────────────────────────
const HINTS = {
  'analyyttinen':'pohdit asioita tarkasti',

  'päämäärätietoinen':'tiedät, mihin tähtäät',
  'ilmaisukykyinen':'osaat kertoa asiasi selvästi',
  'organisoiva':'saat asiat järjestykseen',
  'tavoitteellinen':'asetat itsellesi tavoitteita',
  'suunnitelmallinen':'mietit etukäteen, mitä teet',

  'harkitseva':'mietit ennen kuin teet',
  'mielikuvituksellinen':'keksit uusia juttuja',

  'sopeutuva':'pärjäät erilaisissa tilanteissa',
  'aloitteellinen':'aloitat asioita itse',
  'motivoiva':'saat muut innostumaan',

  'hyvä vetäjä':'otat vetovastuun ryhmässä',
  'unelmoiva':'uskallat ajatella isosti',
  'kärsivällinen':'jaksat odottaa ja yrittää uudelleen',
  'oppimishaluinen':'haluat oppia uutta',
  'tarkkaavainen':'huomaat pienetkin asiat',
  'sitkeä':'et anna periksi helposti',
  'sinnikäs':'jatkat, vaikka olisi vaikeaa',
  'empaattinen':'ymmärrät, miltä toisesta tuntuu',
  'kuunteleva':'kuuntelet toista oikeasti',
  'luotettava':'sovitut asiat pitävät',
  'päättäväinen':'päätät ja pidät kiinni päätöksestä',
  'rehellinen':'sanot asiat suoraan ja reilusti'
};
// "Mitä sanat tarkoittavat?" – avautuva lista vaikeimmille sanoille
function hintsHtml(key, chips){
  const items = chips.filter(c => HINTS[c]);
  if(!items.length) return '';
  return `<details class="hints" ${S.hints[key] ? 'open' : ''} ontoggle="S.hints[${q(key)}]=this.open">
    <summary>Mitä sanat tarkoittavat?</summary>
    <ul>${items.map(c => `<li><strong>${esc(c)}</strong> – ${esc(HINTS[c])}</li>`).join('')}</ul>
  </details>`;
}

// ── HELPERS ───────────────────────────────────────────────────────────────────
const $ = id => document.getElementById(id);
const MIN_STRENGTHS = 5;
// Turvallinen tekstin tulostus HTML:ään (oppilaan kirjoittama teksti)
const esc = s => String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
// Turvallinen JS-merkkijono HTML-attribuutin (onclick) sisällä
const q = s => esc(JSON.stringify(String(s)));
// Teksti riveineen
const nl = s => esc(s).replace(/\n/g,'<br>');
const EMOJI_RE = /(?:\p{Extended_Pictographic}(?:\uFE0F|\u200D\p{Extended_Pictographic})*|[✓→←])/gu;
// Emojit ja nuolet piiloon ruudunlukijalta (teksti jää luettavaksi)
function hideEmojis(root){
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  const nodes = [];
  while(walker.nextNode()) nodes.push(walker.currentNode);
  nodes.forEach(n => {
    const p = n.parentElement;
    if(!p || p.closest('textarea, pre, script, style, option, [aria-hidden="true"]')) return;
    EMOJI_RE.lastIndex = 0;
    if(!EMOJI_RE.test(n.nodeValue)) return;
    EMOJI_RE.lastIndex = 0;
    const frag = document.createDocumentFragment();
    const txt = n.nodeValue; let last = 0, m;
    while((m = EMOJI_RE.exec(txt)) !== null){
      if(m.index > last) frag.appendChild(document.createTextNode(txt.slice(last, m.index)));
      const sp = document.createElement('span'); sp.setAttribute('aria-hidden','true'); sp.textContent = m[0];
      frag.appendChild(sp); last = m.index + m[0].length;
    }
    if(last < txt.length) frag.appendChild(document.createTextNode(txt.slice(last)));
    n.replaceWith(frag);
  });
}
let firstRender = true, keepFocus = false;
function render(html){
  const scr = $('screen');
  scr.innerHTML = html;
  hideEmojis(scr);
  window.scrollTo(0,0);
  const bb = $('bagBar'); if(bb) bb.hidden = true;
  // Uuteen näkymään siirryttäessä fokus menee otsikkoon, jotta ruudunlukija huomaa sisällön vaihtuneen
  if(firstRender){ firstRender = false; return; }
  if(keepFocus) return;
  const h = scr.querySelector('h1, .cover-logo');
  if(h){ h.setAttribute('tabindex','-1'); h.focus({preventScroll:true}); }
}
// Puhekupla + robo (n = 1 tai 2)
function puhe(teksti, n){
  return `<div class="puhe"><div class="kupla" role="note">${teksti}</div>
    <img class="robo" src="/images/supervoimat-robo${n===2?'2':'3'}.webp" width="360" height="${n===2?639:540}" alt="" aria-hidden="true"></div>`;
}
// Piirtää saman näkymän uudelleen niin, että vieritys pysyy paikallaan (esim. vahvuuden valinta)
function rerenderKeepScroll(fn){
  const y = window.scrollY;
  keepFocus = true;
  try { fn(); } finally { keepFocus = false; }
  window.scrollTo(0, y);
}
function pb(pct, label){
  return `<div class="step-label">${label}</div>
  <div class="pbar"><div class="pfill" style="width:${pct}%"></div></div>`;
}
// Poistaa repun paikoista vahvuudet, joita oppilas ei ole enää valinnut. Palauttaa poistettujen määrän.
function syncSlots(){
  const valid = new Set(allChips());
  let n = 0;
  S.slots = S.slots.map(v => { if(v && !valid.has(v)){ n++; return null; } return v; });
  return n;
}
function allChips(){
  return [...new Set([...S.sv_chips, ...Object.values(S.vm).flatMap(x => [...x])])];
}

// ── SCREEN 0: START ───────────────────────────────────────────────────────────
function showStart(){
  const chips = [['Sinnikäs','#c2410c'],['Luova','#d62b52'],['Rohkea','#0a6fc2'],['Utelias','#6b46c1'],['Luotettava','#00796a'],['Yhteistyökykyinen','#a83fc7']]
    .map(([n,c],i) => `<span class="alku-chip" style="--c:${c};--d:${i*0.35}s">${n}</span>`).join('');
  render(`
    <div class="alku">
      <div class="alku-teksti">
        <span class="alku-merkki">9. luokka · Vahvuudet matkaasi</span>

      </div>
      <div class="alku-hahmo alku-hahmo--l" aria-hidden="true"><img src="/images/supervoimat-robo3.webp" width="360" height="540" alt=""></div>
      <div class="alku-hahmo alku-hahmo--r" aria-hidden="true"><img src="/images/supervoimat-robo2.webp" width="360" height="639" alt=""></div>

        ${vmLinkHtml()}

      </div>

}

// ── SCREEN 1: SUPERVOIMAT MUISTUTUS ──────────────────────────────────────────
function showSV(){
  const typeCards = Object.entries(SV_TYPES).map(([name,t]) => `
    <div class="type-card${S.sv_type===name?' selected':''}"
      onclick="selectSVType(${q(name)})"
      onkeydown="if(event.key==='Enter'||event.key===' ')selectSVType(${q(name)})"
      tabindex="0" role="radio" aria-checked="${S.sv_type===name?'true':'false'}"
      aria-label="${name} ${t.emoji}">
      <span class="tc-emoji" aria-hidden="true">${t.emoji}</span>
      ${name}
    </div>`).join('');

  const chipHtml = S.sv_type ? SV_TYPES[S.sv_type].chips.map(c =>
    `<span class="chip teal${S.sv_chips.has(c)?' on':''}"
      onclick="toggleSV(${q(c)})"
      onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();toggleSV(${q(c)})}"
      tabindex="0" role="checkbox" aria-checked="${S.sv_chips.has(c)?'true':'false'}"
      aria-label="Vahvuus: ${esc(c)}">${esc(c)}</span>`
  ).join('') : '';

  render(`
    ${pb(20,'Vaihe 1 / 4 – Supervoimat')}
    <div class="phase-badge">7. LUOKKA · SUPERVOIMAT</div>
    <h1>Mikä suunta tuntuu sinulta nyt?</h1>
    ${puhe('Muistatko 7. luokalla tekemäsi Supervoima-etsintä -tehtävän?<br>Valitse alta suunta, joka tuntuu sinulta nyt. Jos et muista, valitse se, joka tuntuu tänään oikeimmalta.', 1)}
    <div class="card-info" style="text-align:center;margin:.2rem 0 .4rem">Valitse ensin suunta alta. Valitse sitten vähintään 1 vahvuus.</div>
    <div class="type-grid">${typeCards}</div>
    <p class="tyyppi-huom">Tämä on tämänhetkinen suuntasi, ja se voi muuttua. Se ei ole leima. Voit vaihtaa sitä milloin vain.</p>

    ${S.sv_type ? `
      <div class="card" style="margin-top:.8rem">
        <h3 style="text-align:left;color:var(--teal);margin-bottom:.6rem">
          ${SV_TYPES[S.sv_type].emoji} ${S.sv_type} – valitse vahvuudet, jotka ovat sinulle tuttuja

        <div class="chips-wrap">${chipHtml}</div>
        ${hintsHtml('sv', SV_TYPES[S.sv_type].chips)}

      <div style="width:100%;margin-top:.3rem">
        <div style="font-size:.85rem;color:var(--muted);margin-bottom:.4rem">Tai kirjoita oma vahvuus:</div>
        <div style="display:flex;gap:.5rem">
          <input id="svCustom" type="text" placeholder="Esim. humoristinen"
            style="flex:1;background:#ffffff;border:1px solid rgba(31,35,64,.2);
            border-radius:10px;color:var(--text);font-family:Nunito,sans-serif;font-size:.92rem;
            padding:.55rem .8rem;" onkeydown="if(event.key==='Enter')addSVCustom()">
          <button class="add-btn" onclick="addSVCustom()" style="background:var(--accent);border:none;border-radius:10px;
            color:#fff;font-family:Nunito,sans-serif;font-weight:700;font-size:.9rem;
            padding:.55rem 1rem;cursor:pointer;">+ Lisää</button>
        </div>
        ${[...S.sv_chips].filter(c => !SV_TYPES[S.sv_type]?.chips.includes(c)).length > 0 ?
          `<div class="chips-wrap" style="margin-top:.5rem">
            ${[...S.sv_chips].filter(c => !SV_TYPES[S.sv_type].chips.includes(c)).map(c =>
              `<span class="chip teal on custom" onclick="toggleSV(${q(c)})"
                onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();toggleSV(${q(c)})}"
                tabindex="0" role="button" aria-label="Poista vahvuus: ${esc(c)}">${esc(c)} ✕</span>`
            ).join('')}
          </div>` : ''}
      </div>
    ` : ''}

    <div class="btn-group" style="max-width:400px;width:100%;margin-top:1rem">
      ${S.sv_type && S.sv_chips.size > 0 ?
        `<button class="btn btn-primary" onclick="showVM()">Seuraava: Vahvuusmatka →</button>` :
        `<button class="btn btn-ghost" disabled style="opacity:.4;cursor:not-allowed">Seuraava: Vahvuusmatka →</button>`}
    </div>
  `);
}

function selectSVType(name){
  S.sv_type = name;
  rerenderKeepScroll(showSV);
}
function toggleSV(c){
  if(S.sv_chips.has(c)) S.sv_chips.delete(c);
  else S.sv_chips.add(c);
  rerenderKeepScroll(showSV);
}
function addSVCustom(){
  const inp = $('svCustom');
  const val = (inp?.value||'').trim();
  if(val){ S.sv_chips.add(val.slice(0,30)); rerenderKeepScroll(showSV); }
}

// ── SCREEN 2: VAHVUUSMATKA MUISTUTUS ─────────────────────────────────────────
function vmSet(id){ return S.vm[id] || (S.vm[id] = new Set()); }
function showVM(){
  const areaSections = VM_AREAS.map(area => {
    const set = vmSet(area.id);

        ${customs.map(c =>
          `<span class="chip teal on custom" onclick="toggleVM(${q(c)},${aid})"

            tabindex="0" role="button" aria-label="Poista vahvuus: ${esc(c)}">${esc(c)} ✕</span>`
        ).join('')}
      </div>
      ${hintsHtml(area.id, area.chips)}
      <div style="display:flex;gap:.4rem;margin-top:.5rem">
        <input id="vm_${area.id}" type="text" maxlength="30" placeholder="Oma vahvuus…"
          aria-label="Oma vahvuus: ${esc(plainLabel)}"
          style="flex:1;background:#ffffff;border:1px solid rgba(31,35,64,.2);
          border-radius:8px;color:var(--text);font-family:Nunito,sans-serif;font-size:.85rem;padding:.4rem .7rem;"
          onkeydown="if(event.key==='Enter')addVMCustom(${aid})">
        <button class="add-btn" onclick="addVMCustom(${aid})" style="background:rgba(0,121,106,.2);border:1px solid var(--teal);
          border-radius:8px;color:var(--teal);font-family:Nunito,sans-serif;font-weight:700;font-size:.82rem;
          padding:.4rem .7rem;cursor:pointer;white-space:nowrap;">+ Lisää</button>
      </div>
    </div>`;
  }).join('');

  render(`
    ${pb(40,'Vaihe 2 / 4 – Vahvuusmatka')}
    <div class="phase-badge">8. LUOKKA · VAHVUUSMATKA</div>
    <h1>Mitä Vahvuusmatkasta jäi mieleen?</h1>
    ${puhe('Muistatko 8. luokalla tekemäsi Vahvuusmatkan? Käyt nyt läpi samat aiheet nopeasti.<br>Valitse vahvuudet, jotka ovat sinulle tuttuja – tai kirjoita omiasi.', 2)}
    ${vmLinkHtml()}
    ${areaSections}

    <div style="margin-top:.8rem;width:100%;text-align:center">
      <span style="font-size:.9rem;color:var(--muted)">Valittu yhteensä: </span>
      <span style="font-size:.9rem;color:var(--teal);font-weight:700">${allChips().length} vahvuutta</span>
      <span style="font-size:.85rem;color:var(--muted)"> Tarvitset vähintään ${MIN_STRENGTHS}, jotta voit pakata reppusi.</span>
    </div>

    <div class="btn-group" style="max-width:400px;width:100%;margin-top:1rem">
      ${allChips().length >= MIN_STRENGTHS ?
        `<button class="btn btn-primary" onclick="showReppu()">Pakkaa reppu →</button>` :

      <button class="btn btn-ghost" onclick="showSV()">← Takaisin</button>
    </div>
  `);
}

function toggleVM(c, areaId){
  const set = vmSet(areaId);
  if(set.has(c)) set.delete(c); else set.add(c);
  rerenderKeepScroll(showVM);
}
function addVMCustom(areaId){
  const inp = $(`vm_${areaId}`);
  const val = (inp?.value||'').trim();
  if(val){ vmSet(areaId).add(val.slice(0,30)); rerenderKeepScroll(showVM); }
}

// ── DRAG & DROP ───────────────────────────────────────────────────────────────
function onDragStart(e, chip){
  S.dragItem = chip;
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', chip);
  setTimeout(()=>{ if(e.target) e.target.classList.add('dragging'); },0);
}
function onDragOver(e){
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  e.currentTarget.classList.add('over');
}
function onDragLeave(e){
  e.currentTarget.classList.remove('over');
}
function onDrop(e, slotIdx){
  e.preventDefault();
  e.currentTarget.classList.remove('over');
  const chip = e.dataTransfer.getData('text/plain') || S.dragItem;
  if(!chip || S.slots.includes(chip)) return; // jo repussa
  S.slots[slotIdx] = chip;
  refreshReppu();
}
// Napautus / Enter: lisää vahvuus seuraavaan vapaaseen paikkaan
function addToNextSlot(chip){
  if(S.slots.includes(chip)) return;
  const idx = S.slots.indexOf(null);
  if(idx === -1){ scrollToPackDone(); return; } // reppu jo täynnä
  S.slots[idx] = chip;
  refreshReppu();
}
function removeSlot(i){
  S.slots[i] = null;
  refreshReppu();
}
// Kiinteä laskuripalkki (näkyy CSS:llä vain pienellä näytöllä)
function updateBagBar(n){
  const bar = $('bagBar'); if(!bar) return;
  const full = n === 5;
  bar.className = 'bag-bar' + (full ? ' full' : '');
  bar.innerHTML = `
    <div>
      <div class="bag-bar-count"><strong>${n}</strong> / 5 pakattu</div>
      <div class="bag-bar-dots" aria-hidden="true">${[0,1,2,3,4].map(i => `<span class="bag-bar-dot${i < n ? ' on' : ''}"></span>`).join('')}</div>
    </div>
    ${full ? `<button class="bag-bar-btn" onclick="showDone()">Reppu täynnä! →</button>` : ''}`;
  bar.hidden = false;
}
function scrollToPackDone(){
  const btn = document.querySelector('.bag-panel .btn-primary');
  if(btn) btn.scrollIntoView({behavior:'smooth', block:'center'});
}
// Piirtää reppunäkymän uudelleen: vieritys ja näppäimistökohdistus säilyvät
function refreshReppu(){
  const activeId = document.activeElement && document.activeElement.id;
  rerenderKeepScroll(showReppu);
  const el = activeId && activeId.startsWith('chip_') ? $(activeId) : null;
  const target = (el && el.tabIndex >= 0) ? el : (activeId && activeId.startsWith('chip_') ? document.querySelector('.pool-chip:not(.used)') : null);
  if(target) target.focus({preventScroll:true});
  if(S.slots.every(Boolean)) scrollToPackDone();
}

// ── CV HELPERS ────────────────────────────────────────────────────────────────
function saveCVFields(){
  ['nimi','paikkakunta','sahkoposti','puhelin','esittely','koulutus','vahvuudet','esim_vahvuus','esim_tilanne','harrastukset'].forEach(k=>{
    const el = $('cv_'+k);
    if(el) S.cv_text[k] = el.value;
  });
}

// Vapaaehtoinen: yksi vahvuus + tilanne, jossa se näkyi
function cvExample(){
  const packed = S.slots.filter(Boolean);
  const sel = packed.includes(S.cv_text.esim_vahvuus) ? S.cv_text.esim_vahvuus : (packed[0] || '');
  const text = (S.cv_text.esim_tilanne || '').trim();
  return (sel && text) ? { v: sel, t: text } : null;
}
function cvExampleHTML(){
  const ex = cvExample();
  if(!ex) return '';
  const label = ex.v.charAt(0).toUpperCase() + ex.v.slice(1);
  return `<h2>Vahvuus käytännössä</h2>
      <p><strong>${esc(label)}:</strong> ${nl(ex.t)}</p>`;
}
// Yksi CV-osio; tyhjä osio jätetään kokonaan pois
function cvSec(title, text){
  const t = (text||'').trim();
  return t ? `<h2>${esc(title)}</h2>
      <p>${nl(t)}</p>` : '';
}
// Mitä CV:stä vielä puuttuu (näytetään varoituksena esikatselussa)
function cvMissing(){
  const m = [];
  if(!(S.cv_text.nimi||'').trim()) m.push('Nimi');
  if(!(S.cv_text.esittely||'').trim()) m.push('Esittely');
  if(!(S.cv_text.koulutus||'').trim()) m.push('Koulutus');
  return m;
}
function cvName(){ return (S.cv_text.nimi||'').trim(); }
function cvContact(){
  return [S.cv_text.paikkakunta, S.cv_text.sahkoposti, S.cv_text.puhelin]
    .map(x => (x||'').trim()).filter(Boolean).map(esc).join(' · ');
}
function cvHTML(forPrint){
  const packed = S.slots.filter(Boolean);
  const type   = S.sv_type;
  const chips  = packed.map(c=>`<span class="cv-chip">${esc(c)}</span>`).join(' ');
  const extra  = (S.cv_text.vahvuudet||'').trim()
    ? `<p>${nl(S.cv_text.vahvuudet||'')}</p>` : '';
  return `
    <div class="cv-preview">
      <h1>${cvName() ? esc(cvName()) : 'Oma CV'}</h1>
      ${cvContact() ? `<p class="cv-sub" style="margin-bottom:.2rem">${cvContact()}</p>` : ''}
      ${cvSec('Esittely', S.cv_text.esittely)}
      ${cvSec('Koulutus', S.cv_text.koulutus)}
      <h2>Vahvuudet ja taidot</h2>
      <p>${chips}</p>${extra}
      ${cvExampleHTML()}
      ${cvSec('Harrastukset ja kokemus', S.cv_text.harrastukset)}
    </div>`;
}
