<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ajattelun tehostaminen</title>
<script src="/vendor/chart/chart.umd.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
.sr-only{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden;}
body{font-family:system-ui,-apple-system,sans-serif;background:#FFF3E0;color:#412402;}
.app{padding:1.25rem;max-width:700px;margin:0 auto;background:#FFF3E0;min-height:100vh;}

/* Cards */
.card{background:#fff;border:0.5px solid #F5C4B3;border-radius:12px;padding:1.25rem;margin-bottom:1rem;}
.card-warm{background:#FFFBF5;border:0.5px solid #F5C4B3;border-radius:12px;padding:1.25rem;margin-bottom:1rem;}
.section-label{font-size:11px;font-weight:500;letter-spacing:.06em;color:#BA7517;text-transform:uppercase;margin-bottom:10px;}

/* XP */
.xp-wrap{background:#F5C4B3;border-radius:99px;height:14px;overflow:hidden;}
.xp-fill{height:14px;border-radius:99px;transition:width 0.5s ease;background:#1D9E75;}
.xp-fill2{height:14px;border-radius:99px;transition:width 0.5s ease;background:#7F77DD;}
.xp-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
.xp-label{font-size:13px;color:#633806;}
.xp-val{font-size:13px;font-weight:500;color:#412402;}

/* Typography */
.mode-badge{display:inline-block;font-size:12px;font-weight:500;padding:3px 10px;border-radius:99px;margin-bottom:10px;}
.scenario{font-size:15px;color:#412402;line-height:1.75;margin-bottom:1rem;}
.thinking-label{font-size:13px;color:#633806;margin-bottom:8px;line-height:1.6;}

/* Multiple choice options */
.mc-question{font-size:14px;font-weight:500;color:#412402;margin-bottom:4px;line-height:1.6;}
.mc-help{font-size:12px;color:#BA7517;margin-bottom:12px;}
.mc-list{display:grid;gap:8px;}
.mc-option{display:flex;align-items:flex-start;gap:11px;background:#FFFBF5;border:1.5px solid #F0997B;border-radius:8px;padding:11px 13px;cursor:pointer;text-align:left;font-family:inherit;transition:all .12s;width:100%;}
.mc-option:hover{background:#FAECE7;}
.mc-option:focus-visible{outline:3px solid #D85A30;outline-offset:2px;}
.mc-option.selected{border-color:#D85A30;background:#FAECE7;}
.mc-option[disabled]{cursor:default;opacity:1;}
.mc-box{width:22px;height:22px;border-radius:5px;border:1.5px solid #F0997B;background:#fff;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:14px;margin-top:1px;transition:all .12s;}
.mc-option.selected .mc-box{background:#D85A30;border-color:#D85A30;color:#fff;}
.mc-radio .mc-box{border-radius:50%;}
.mc-text{font-size:13.5px;color:#412402;line-height:1.6;}
/* Checked/feedback states */
.mc-option.correct-pick{border-color:#1D9E75;background:#EAF5EF;}
.mc-option.correct-pick .mc-box{background:#1D9E75;border-color:#1D9E75;color:#fff;}
.mc-option.wrong-pick{border-color:#E24B4A;background:#FBECEC;}
.mc-option.wrong-pick .mc-box{background:#E24B4A;border-color:#E24B4A;color:#fff;}
.mc-option.missed{border-color:#1D9E75;border-style:dashed;background:#F5FAF7;}
.mc-tag{font-size:11px;font-weight:500;margin-left:auto;flex-shrink:0;align-self:center;}
.mc-tag.ok{color:#0F6E56;}
.mc-tag.no{color:#A32D2D;}
.mc-tag.miss{color:#0F6E56;}
.mc-feedback{margin-top:12px;padding:12px 14px;border-radius:8px;font-size:13px;line-height:1.7;}
.mc-feedback.good{background:#EAF5EF;border-left:3px solid #1D9E75;color:#0F6E56;}
.mc-feedback.partial{background:#FDF3E3;border-left:3px solid #EF9F27;color:#7A4A08;}
.mc-feedback.bad{background:#FBECEC;border-left:3px solid #E24B4A;color:#8A2A2A;}
.mc-score-pill{display:inline-block;font-weight:600;background:#fff;border-radius:99px;padding:1px 10px;margin-left:4px;}

/* Reflection */
textarea{width:100%;font-size:14px;padding:10px 12px;border:1.5px solid #F0997B;border-radius:8px;background:#FFFBF5;color:#412402;font-family:inherit;resize:vertical;line-height:1.7;}
textarea:focus{outline:3px solid #D85A30;outline-offset:2px;border-color:transparent;}
.reflect-hint{font-size:12px;color:#BA7517;margin-top:4px;}

/* Hint */
.hint-btn{font-size:13px;color:#633806;background:none;border:1px solid #F0997B;border-radius:8px;padding:6px 12px;cursor:pointer;margin-top:12px;}
.hint-btn:hover{background:#FAECE7;}
.hint-btn:focus{outline:3px solid #D85A30;outline-offset:2px;}
.hint-box{margin-top:10px;padding:10px 14px;background:#FAECE7;border-radius:8px;border-left:3px solid #D85A30;font-size:13px;color:#712B13;line-height:1.75;}

/* Divider */
.divider{height:1px;background:#F5C4B3;margin:1rem 0;}

/* Score chip */
.score-chip{display:inline-flex;align-items:center;gap:5px;background:#FAECE7;border:0.5px solid #F0997B;border-radius:99px;padding:4px 12px;font-size:13px;color:#633806;}
.score-chip strong{color:#412402;}

/* Buttons */
.btn-row{display:flex;gap:10px;margin-top:1rem;align-items:center;flex-wrap:wrap;}
.next-btn{background:#fff;border:1px solid #F0997B;border-radius:8px;padding:10px 20px;font-size:14px;cursor:pointer;font-family:inherit;color:#412402;}
.next-btn:hover{background:#FAECE7;}
.next-btn:focus{outline:3px solid #D85A30;outline-offset:2px;}
.next-btn:disabled{opacity:0.4;cursor:not-allowed;}
.primary-btn{color:#fff;border:none;border-radius:8px;padding:10px 22px;font-size:14px;cursor:pointer;font-family:inherit;font-weight:500;}
.primary-btn:hover{opacity:.88;}
.primary-btn:focus{outline:3px solid #D85A30;outline-offset:2px;}
.primary-btn:disabled{opacity:.4;cursor:not-allowed;}
.step-counter{font-size:13px;color:#BA7517;}

/* Notes */
.bonus-note{font-size:12px;color:#633806;background:#FAEEDA;border-radius:99px;padding:2px 9px;display:inline-block;margin-top:6px;}
.hint-penalty{font-size:11px;color:#633806;background:#FAEEDA;border-radius:99px;padding:2px 7px;margin-left:5px;}
.no-hint-note{font-size:12px;color:#BA7517;margin-top:12px;padding:8px 12px;border:1px dashed #F0997B;border-radius:8px;background:#FFFBF5;}
.error-note{font-size:12px;color:#A32D2D;margin-top:6px;}
.reflect-btn{background:none;border:1px solid #F0997B;border-radius:8px;padding:10px 16px;font-size:14px;cursor:pointer;color:#412402;font-family:inherit;}
.reflect-btn:hover{background:#FAECE7;}
.reflect-btn:focus{outline:3px solid #D85A30;outline-offset:2px;}

/* Map */
.map-row{display:flex;gap:8px;justify-content:center;align-items:flex-end;flex-wrap:wrap;margin-bottom:4px;}
.map-node{display:flex;flex-direction:column;align-items:center;gap:4px;}
.map-circle{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;border:2px solid transparent;transition:all 0.3s;}
.map-circle.done{border-color:transparent;}
.map-circle.active{border-color:#EF9F27;box-shadow:0 0 0 3px #FAEEDA;}
.map-circle.locked{opacity:.35;filter:grayscale(1);}
.map-label{font-size:10px;color:#BA7517;text-align:center;max-width:54px;line-height:1.3;}
.map-connector{width:24px;height:2px;margin-bottom:23px;border-radius:1px;}

/* Brain */
.brain-svg{display:block;margin:0 auto;}

/* Radar */
.radar-container{position:relative;width:100%;height:260px;}

/* Summary grid */
.summary-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(116px,1fr));gap:8px;margin:1rem 0;}
.summary-item{padding:10px 12px;border-radius:8px;border:0.5px solid #F5C4B3;}
.summary-mode{font-size:11px;font-weight:500;margin-bottom:5px;}
.summary-stars{font-size:16px;letter-spacing:1px;}
.summary-pts{font-size:12px;margin-top:3px;}

/* Compare */
.compare-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:1rem;}
.compare-col{background:#FAECE7;border-radius:8px;padding:10px 12px;}
.compare-col-title{font-size:11px;font-weight:500;margin-bottom:8px;color:#633806;}
.compare-bar-wrap{margin-bottom:6px;}
.compare-bar-label{font-size:11px;color:#633806;margin-bottom:2px;}
.compare-bar-bg{background:#F5C4B3;border-radius:99px;height:6px;overflow:hidden;}
.compare-bar-fill{height:6px;border-radius:99px;transition:width .5s;}

/* Peer */
.peer-card{background:#fff;border:2px solid #7F77DD44;border-radius:12px;padding:1.25rem;margin-bottom:1rem;}
.peer-phase-badge{display:inline-block;font-size:12px;font-weight:500;padding:4px 12px;border-radius:99px;background:#EEEDFE;color:#3C3489;margin-bottom:12px;}
.peer-answer-box{background:#FFFBF5;border-radius:8px;padding:12px 14px;font-size:14px;line-height:1.75;color:#412402;margin-bottom:1rem;border-left:3px solid #7F77DD;white-space:pre-wrap;}
.peer-rubric{display:grid;gap:6px;margin-bottom:1rem;}
.peer-rubric-item{display:flex;align-items:flex-start;gap:10px;background:#FFFBF5;border-radius:8px;padding:10px 12px;border:0.5px solid #F5C4B3;}
.peer-rubric-check{width:24px;height:24px;border-radius:4px;border:1.5px solid #F0997B;background:#fff;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:14px;margin-top:1px;transition:all .15s;}
.peer-rubric-check.checked{background:#7F77DD;border-color:#7F77DD;color:#fff;}
.peer-rubric-check:focus{outline:3px solid #D85A30;outline-offset:2px;}
.peer-rubric-text{font-size:13px;color:#412402;line-height:1.6;}

/* Pass device */
.pass-screen{text-align:center;padding:2.5rem 1rem;}
.pass-emoji{font-size:56px;line-height:1;margin-bottom:1rem;}
.pass-title{font-size:20px;font-weight:500;margin-bottom:.75rem;color:#412402;}
.pass-sub{font-size:14px;color:#633806;line-height:1.75;margin-bottom:1.5rem;}

/* Level up */
.levelup-card{background:#fff;border:0.5px solid #F5C4B3;border-radius:12px;padding:2rem 1.5rem;text-align:center;}
.levelup-title{font-size:20px;font-weight:500;margin-bottom:.75rem;color:#412402;}
.levelup-sub{font-size:15px;color:#633806;line-height:1.75;margin-bottom:1.5rem;max-width:440px;margin-left:auto;margin-right:auto;}
.levelup-compare{display:flex;gap:12px;justify-content:center;margin-bottom:1.5rem;flex-wrap:wrap;}
.levelup-box{border-radius:8px;border:1px solid #F5C4B3;padding:14px 18px;text-align:left;min-width:170px;background:#FFFBF5;}
.levelup-box-title{font-size:12px;font-weight:500;margin-bottom:8px;}
.levelup-box-item{font-size:13px;color:#412402;margin-bottom:6px;line-height:1.5;}
.levelup-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}

/* Hero */
.hero-banner{background:#FAECE7;border-radius:12px;padding:1.75rem;text-align:center;margin-bottom:1rem;border:0.5px solid #F5C4B3;}
.hero-title{font-size:24px;font-weight:500;color:#412402;margin-bottom:.4rem;}
.hero-sub{font-size:14px;color:#633806;line-height:1.7;}

/* Mode pills on start */
.mode-pills{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:.75rem;}
.mode-pill{border-radius:8px;padding:10px 6px;text-align:center;}
.mode-pill-icon{font-size:20px;}
.mode-pill-label{font-size:10px;font-weight:500;margin-top:4px;}

/* Info box */
.info-box{background:#FAEEDA;border-radius:8px;padding:10px 14px;font-size:13px;color:#633806;line-height:1.6;margin-bottom:1rem;border:0.5px solid #FAC775;}

/* Play modes */
.play-modes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:1rem;}
.play-mode-box{background:#FAECE7;border-radius:8px;padding:14px;border:0.5px solid #F5C4B3;}
.play-mode-icon{font-size:22px;margin-bottom:6px;}
.play-mode-title{font-size:13px;font-weight:500;color:#412402;margin-bottom:4px;}
.play-mode-desc{font-size:12px;color:#633806;line-height:1.6;}
</style>

  {min:0,  max:4,  label:'Aloittelija',       emoji:'🌱', color:'#9FE1CB'},
  {min:5,  max:9,  label:'Harjoittelija',      emoji:'🔍', color:'#85B7EB'},
  {min:10, max:14, label:'Taitava ajattelija', emoji:'⚡', color:'#AFA9EC'},
  {min:15, max:19, label:'Monipuolinen ajattelija', emoji:'🏆', color:'#FAC775'},
  {min:20, max:25, label:'Mestariajattelija',  emoji:'🌟', color:'#EF9F27'},
];

let peerChecks = {1:Array(5).fill(null),2:Array(5).fill(null)}; // vertaispalaute (ei pisteitä)

/* ── Helpers ── */
function getMode(k){ return MODES.find(m => m.key === k); }

/* Pisteet 0–5 pelkästään monivalinnan oikeellisuudesta */
function mcScore(lvl, i){
  if(!mcChecked[lvl][i]) return 0;
  const opts = ALL_TASKS[lvl][i].mc.options;
  const totalCorrect = opts.filter(o => o.correct).length;
  const sel = mcSel[lvl][i] || [];
  let corr = 0, wrong = 0;
  sel.forEach(idx => { opts[idx] && opts[idx].correct ? corr++ : wrong++; });
  let raw = corr - wrong;
  if(raw < 0) raw = 0;
  let s = Math.round(raw / totalCorrect * 5);
  if(s > 5) s = 5;
  if(s < 0) s = 0;
  if(hintsUsed[lvl][i] && s > 4) s = 4;   // vinkin käyttö rajaa enintään 4 pisteeseen
  return s;
}

function calcScore(lvl){
  let t = 0;
  for(let i = 0; i < 5; i++) t += mcScore(lvl, i);
  return t;
}

function adjStar(lvl, i){ return mcScore(lvl, i); }

function getLevel(s){ return LEVELS.find(l => s >= l.min && s <= l.max) || LEVELS[0]; }

/* ── Shared visual components ── */
function renderMap(curIdx, lvl){
  const tasks = ALL_TASKS[lvl], color = LVL_COLORS[lvl];
  let html = '<div class="map-row" role="list" aria-label="Tehtäväpolku">';
  tasks.forEach((t, i) => {
    const m = getMode(t.mode);
    const isDone   = mcChecked[lvl][i];
    const isActive = i === curIdx;
    const cls = 'map-circle' + (isDone ? ' done' : isActive ? ' active' : ' locked');
    const bg  = (isDone || isActive) ? m.bg : '#FAECE7';
    html += `<div class="map-node" role="listitem" aria-label="${m.label}: ${isDone?'valmis':isActive?'käynnissä':'odottaa'}">
      <div class="${cls}" style="background:${bg};${isDone?'border-color:'+m.color:''}" aria-hidden="true">${isDone?'✓':isActive?m.icon:'○'}</div>
      <div class="map-label" style="color:${isDone?m.tc:isActive?m.tc:'#BA7517'}">${m.label}</div>
    </div>`;
    if(i < tasks.length - 1)
      html += `<div class="map-connector" style="background:${isDone?color:'#F5C4B3'}" aria-hidden="true"></div>`;
  });
  return html + '</div>';
}

  const cx = [72,148,78,142,110], cy = [68,68,108,108,120];

function renderXP(lvl){
  const s1 = calcScore(1), s2 = lvl === 2 ? calcScore(2) : null;
  let html = `
    <div class="xp-row"><span class="xp-label">Perustaso XP</span><span class="xp-val">${s1} / 25</span></div>
    <div class="xp-wrap" role="progressbar" aria-valuenow="${s1}" aria-valuemin="0" aria-valuemax="25" aria-label="Perustaso: ${s1}/25">
      <div class="xp-fill" style="width:${Math.round(s1/25*100)}%"></div>
    </div>`;
  if(s2 !== null) html += `
    <div class="xp-row" style="margin-top:10px"><span class="xp-label">Edistynyt XP</span><span class="xp-val">${s2} / 25</span></div>
    <div class="xp-wrap" role="progressbar" aria-valuenow="${s2}" aria-valuemin="0" aria-valuemax="25" aria-label="Edistynyt: ${s2}/25">
      <div class="xp-fill2" style="width:${Math.round(s2/25*100)}%"></div>
    </div>`;
  return html;
}

function renderMcBlock(lvl){
  const t = ALL_TASKS[lvl][cur], mc = t.mc;
  const sel = mcSel[lvl][cur] || [];
  const checked = mcChecked[lvl][cur];
  const help = mc.multi ? 'Valitse kaikki oikeat (yksi tai useampi).' : 'Valitse yksi oikea vaihtoehto.';

  let optsHtml = mc.options.map((o, i) => {
    const isSel = sel.includes(i);
    let cls = 'mc-option' + (mc.multi ? '' : ' mc-radio');
    let box = isSel ? (mc.multi ? '✓' : '●') : '';
    let tag = '';
    if(checked){
      if(o.correct && isSel){ cls += ' correct-pick'; box = '✓'; tag = '<span class="mc-tag ok">Oikein</span>'; }
      else if(!o.correct && isSel){ cls += ' wrong-pick'; box = '✕'; tag = '<span class="mc-tag no">Väärin</span>'; }
      else if(o.correct && !isSel){ cls += ' missed'; box = '✓'; tag = '<span class="mc-tag miss">Oikea vastaus</span>'; }
    } else if(isSel){ cls += ' selected'; }
    return `<button type="button" class="${cls}" ${checked?'disabled':''}
        role="${mc.multi?'checkbox':'radio'}" aria-checked="${isSel}"
        onclick="toggleMc(${i})">
        <span class="mc-box">${box}</span>
        <span class="mc-text">${o.t}</span>
        ${tag}
      </button>`;
  }).join('');

  let feedback = '';
  if(checked){
    const s = mcScore(lvl, cur);
    const tone = s >= 5 ? 'good' : s >= 1 ? 'partial' : 'bad';
    const head = s >= 5 ? '🎉 Täydet pisteet!' : s >= 1 ? '👍 Osittain oikein.' : '❌ Ei pisteitä tästä.';
    const capNote = (hintsUsed[lvl][cur] && s === 4) ? ' (vinkki rajasi enintään 4 pisteeseen)' : '';
    feedback = `<div class="mc-feedback ${tone}" role="status">
        <strong>${head}</strong> Sait <span class="mc-score-pill">${s} / 5 p</span>${capNote}<br>
        ${mc.explain}
      </div>`;
  }

  const canCheck = sel.length > 0;

  return `
    <p class="mc-question">${mc.question}</p>
    <p class="mc-help">${help}</p>
    <div class="mc-list" role="${mc.multi?'group':'radiogroup'}" aria-label="Vastausvaihtoehdot">
      ${optsHtml}
    </div>
    ${!checked
      ? `<div class="btn-row">
           <button class="primary-btn" style="background:${LVL_COLORS[lvl]}" onclick="checkMc()" ${canCheck?'':'disabled aria-disabled="true"'}>
             Tarkista vastaus
           </button>
           ${!canCheck?'<span class="error-note" role="note">Valitse ainakin yksi vaihtoehto.</span>':''}
         </div>`
      : ''}
    ${feedback}`;
}

        </p>
        <div class="levelup-btns">
          <button class="primary-btn" style="background:#7F77DD;font-size:15px;padding:11px 24px"
            onclick="cur=0;screen='peer';render()">
            Anna kaverille arvioitavaksi →
          </button>
          <button class="next-btn" onclick="finishLevel()">Siirry suoraan tuloksiin</button>
        </div>
      </div>
    </div>`;
}

function renderPeer(app){
  const t = ALL_TASKS[gLvl][cur], m = getMode(t.mode);
  const rubric = RUBRICS[t.mode];
  if(!peerChecks[gLvl][cur]) peerChecks[gLvl][cur] = Array(rubric.length).fill(false);
  const checks = peerChecks[gLvl][cur];
  const checkedCount = checks.filter(Boolean).length;

  app.innerHTML = `
    <div class="peer-card" role="region" aria-label="Vertaispalaute – ${m.label}">
      <span class="peer-phase-badge">👥 Vertaispalaute · tehtävä ${cur+1} / 5</span>
      <h2 style="font-size:16px;font-weight:500;margin-bottom:8px;color:#412402">${m.icon} ${m.label}</h2>

      <p style="font-size:13px;color:#633806;margin-bottom:8px">Kaverin pohdinta:</p>
      <div class="peer-answer-box" aria-label="Kaverin pohdinta">${(reflect[gLvl][cur]||'').trim() || '(Kaveri ei kirjoittanut omaa pohdintaa)'}</div>

      <p style="font-size:13px;font-weight:500;color:#412402;margin-bottom:8px">
        Rastita kohdat, jotka löydät pohdinnasta (tämä on palautetta, ei pisteitä):
      </p>
      <div class="peer-rubric" role="group" aria-label="Palautekriteerit">
        ${rubric.map((item, i) => `
          <div class="peer-rubric-item">
            <button class="peer-rubric-check ${checks[i]?'checked':''}" id="chk${i}"
              role="checkbox" aria-checked="${checks[i]}" aria-label="${item}"
              onclick="toggleCheck(${i})">${checks[i]?'✓':''}</button>
            <span class="peer-rubric-text">${item}</span>
          </div>`).join('')}
      </div>

      <p style="font-size:12px;color:#BA7517;margin-bottom:1rem">${checkedCount} / ${rubric.length} kohtaa löytyi</p>

      <p style="font-size:13px;color:#633806;margin-bottom:6px">Vapaa palaute (valinnainen):</p>
      <textarea id="peer-comment" rows="2"
        placeholder="Kirjoita lyhyt palaute kaverille…"
        oninput="savePeerComment(this.value)">${peerComments[gLvl][cur]||''}</textarea>

      <div class="btn-row" style="margin-top:1rem">
        <button class="next-btn" onclick="prevPeer()" ${cur===0?'disabled aria-disabled="true"':''}>← Edellinen</button>
        <span class="step-counter" aria-hidden="true">${cur+1} / 5</span>
        ${cur < 4
          ? `<button class="primary-btn" style="background:#7F77DD" onclick="nextPeer()">Seuraava →</button>`
          : `<button class="primary-btn" style="background:#7F77DD" onclick="finishLevel()">Valmis – näytä tulokset ✓</button>`}
      </div>
    </div>`;
}

function renderLevelUp(app){
  const score1 = calcScore(1), lv = getLevel(score1);
  app.innerHTML = `
    <div class="levelup-card">
      <div style="font-size:56px;line-height:1;margin-bottom:1rem" role="img" aria-label="Juhlia">🎉</div>
      <h2 class="levelup-title">Perustaso on valmis!</h2>
      <p class="levelup-sub">
        Sait <strong>${score1} pistettä 25:stä</strong>.<br>
        Tasosi on <strong>${lv.label}</strong>.<br><br>
        Haluatko yrittää edistynyttä tasoa?<br>Tehtävät ovat vaikeampia. Vinkkejä ei ole.
      </p>
      <div class="levelup-compare">
        <div class="levelup-box" style="border-color:#1D9E7566">
          <div class="levelup-box-title" style="color:#0F6E56">Perustaso</div>
          <div class="levelup-box-item">✓ Tutut tilanteet</div>
          <div class="levelup-box-item">✓ Vinkit saatavilla</div>
          <div class="levelup-box-item">✓ Selkeät tehtävät</div>
        </div>
        <div class="levelup-box" style="border-color:#7F77DD88">
          <div class="levelup-box-title" style="color:#3C3489">Edistynyt taso</div>
          <div class="levelup-box-item">★ Monimutkaisemmat tilanteet</div>
          <div class="levelup-box-item">★ Ei vinkkejä</div>
          <div class="levelup-box-item">★ Vaatii enemmän miettimistä</div>
        </div>
      </div>
      <div class="levelup-btns">
        <button class="primary-btn" style="background:#7F77DD;font-size:15px;padding:11px 24px" onclick="startLvl2()">
          Otan haasteen vastaan →
        </button>
        <button class="next-btn" onclick="screen='summary1';render()">Katso vain tulokseni</button>
      </div>
    </div>`;
}

function renderSummary(app, lvl){
  const score = calcScore(lvl), lv = getLevel(score);
  const pct = Math.round(score / 25 * 100), color = LVL_COLORS[lvl];
  const adjScores = MODES.map((_, i) => adjStar(lvl, i));
  const hasPrev = history.length > 0;
  const prevScores = hasPrev ? history[history.length-1][lvl] : null;

  const compareHtml = hasPrev && prevScores ? `
    <div class="divider"></div>
    <div class="section-label">Edistyminen – ennen ja nyt</div>
    <div class="compare-row">
      <div class="compare-col">
        <div class="compare-col-title">Edellinen kerta</div>
        ${MODES.map((m,i)=>`<div class="compare-bar-wrap">
          <div class="compare-bar-label" style="color:${m.tc}">${m.icon} ${m.label}</div>
          <div class="compare-bar-bg"><div class="compare-bar-fill" style="width:${Math.round(prevScores[i]/5*100)}%;background:${m.color}44"></div></div>
        </div>`).join('')}
      </div>
      <div class="compare-col">
        <div class="compare-col-title">Tällä kertaa</div>
        ${MODES.map((m,i)=>`<div class="compare-bar-wrap">
          <div class="compare-bar-label" style="color:${m.tc}">${m.icon} ${m.label}</div>
          <div class="compare-bar-bg"><div class="compare-bar-fill" style="width:${Math.round(adjScores[i]/5*100)}%;background:${m.color}"></div></div>
        </div>`).join('')}
      </div>
    </div>` : '';

  app.innerHTML = `
    <div class="card">
      <div style="text-align:center;padding:1rem 0 .5rem">
        <div style="font-size:48px;line-height:1;margin-bottom:.5rem" role="img" aria-label="${lv.label}">${lv.emoji}</div>
        <h2 style="font-size:22px;font-weight:500;margin-bottom:.25rem;color:#412402">${lv.label}</h2>
        <p style="font-size:14px;color:#633806;margin-bottom:.5rem">${LVL_NAMES[lvl]} suoritettu!</p>
        <p style="font-size:36px;font-weight:500;color:#412402" aria-label="${score} pistettä 25:stä">
          ${score} <span style="font-size:16px;color:#BA7517">/ 25 p</span>
        </p>
      </div>
      <div style="background:#F5C4B3;border-radius:99px;height:10px;overflow:hidden;margin:.5rem 0 .25rem"
           role="progressbar" aria-valuenow="${score}" aria-valuemin="0" aria-valuemax="25">
        <div style="height:10px;border-radius:99px;width:${pct}%;background:${color};transition:width .8s"></div>
      </div>
      <p style="font-size:12px;color:#BA7517;text-align:center;margin-bottom:1rem">
        0–4 Aloittelija · 5–9 Harjoittelija · 10–14 Taitava · 15–19 Monipuolinen · 20–25 Mestari
      </p>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:1rem">
        <div>
          <div class="section-label">Tehtäväkohtaiset pisteet</div>
          <div class="summary-grid">
            ${MODES.map((m, i) => {
              const final = adjScores[i];
              return `<div class="summary-item" style="background:${m.bg}30;border-color:${m.bg}"
                aria-label="${m.label}: ${final} pistettä">
                <div class="summary-mode" style="color:${m.tc}">${m.icon} ${m.label}</div>
                <div class="summary-stars" aria-hidden="true">${'★'.repeat(final)}${'☆'.repeat(5-final)}</div>
                <div class="summary-pts" style="color:${m.tc}">${final}/5</div>
              </div>`;
            }).join('')}
          </div>
        </div>
        <div>
          <div class="section-label">Ajatteluprofiili</div>
          <div class="radar-container">
            <canvas id="radarChart" role="img" aria-label="Hämähäkinverkko ajattelutaidoista">
              ${MODES.map((m,i)=>m.label+': '+adjScores[i]+'/5').join(', ')}
            </canvas>
          </div>
        </div>
      </div>

      ${compareHtml}

      <div class="divider"></div>
      <div class="section-label">Aivoaktiivisuus – loppukatselmus</div>
      ${renderBrain(lvl)}

      <div class="divider"></div>
      <div class="btn-row" style="justify-content:center;margin-top:.5rem">
        ${lvl === 1
          ? `<button class="primary-btn" style="background:#7F77DD" onclick="goLevelUp()">
               Siirry edistyneelle tasolle →
             </button>`
          : ''
        }
        <button class="next-btn" onclick="restartAll()">Aloita alusta</button>
      </div>
    </div>`;

  setTimeout(() => {
    const cv = document.getElementById('radarChart');
    if(!cv) return;
    const datasets = [{
      label: 'Tällä kertaa',
      data: adjScores,
      backgroundColor: color + '33',
      borderColor: color,
      borderWidth: 2,
      pointBackgroundColor: color,
      pointRadius: 4,
    }];
    if(prevScores) datasets.push({
      label: 'Edellinen kerta',
      data: prevScores,
      backgroundColor: 'transparent',
      borderColor: '#F0997B',
      borderWidth: 1.5,
      borderDash: [4,4],
      pointBackgroundColor: '#F0997B',
      pointRadius: 3,
    });
    radarChart = new Chart(cv, {
      type: 'radar',
      data: { labels: MODES.map(m => m.label), datasets },
      options: {
        responsive: true, maintainAspectRatio: false,
        scales: { r: {
          min: 0, max: 5,
          ticks: { stepSize: 1, font: {size:10}, color: '#633806' },
          grid: { color: '#F5C4B3' },
          pointLabels: { font: {size:11}, color: '#412402' },
        }},
        plugins: { legend: { display: !!prevScores, position: 'bottom', labels: { font:{size:11}, boxWidth:12 } } },
      },
    });
  }, 80);
}

/* ── Event handlers ── */
function toggleMc(i){
  if(mcChecked[gLvl][cur]) return;              // lukittu tarkistuksen jälkeen
  const mc = ALL_TASKS[gLvl][cur].mc;
  let sel = mcSel[gLvl][cur] || [];
  if(mc.multi){
    sel = sel.includes(i) ? sel.filter(x => x !== i) : [...sel, i];
  } else {
    sel = sel.includes(i) ? [] : [i];           // yksi valinta kerrallaan
  }
  mcSel[gLvl][cur] = sel;
  render();
}

function checkMc(){
  const sel = mcSel[gLvl][cur] || [];
  if(sel.length === 0) return;
  mcChecked[gLvl][cur] = true;
  render();
}

function onReflect(v){ reflect[gLvl][cur] = v; }

function toggleHint(){
  if(mcChecked[gLvl][cur]) return;
  hintsShown[gLvl][cur] = !hintsShown[gLvl][cur];
  if(hintsShown[gLvl][cur]) hintsUsed[gLvl][cur] = true;
  render();
}

function toggleCheck(i){
  const checks = peerChecks[gLvl][cur];
  checks[i] = !checks[i];
  render();
}

function savePeerComment(v){ peerComments[gLvl][cur] = v; }

function goToPeer(){
  if(!mcChecked[gLvl][cur]) return;
  screen = 'passdevice'; render();
}

function nextPeer(){ if(cur < 4){ cur++; render(); } }
function prevPeer(){ if(cur > 0){ cur--; render(); } }

function finishLevel(){
  cur = 4;
  screen = gLvl === 1 ? 'levelup' : 'summary2';
  render();
}

function nextT(){
  if(!mcChecked[gLvl][cur]) return;
  if(cur < 4){ cur++; screen='game'; render(); }
}

function prevT(){
  if(cur > 0){ cur--; screen='game'; render(); }
}

function goLevelUp(){ screen='summary1'; render(); }
function startLvl2(){ gLvl=2; cur=0; screen='game'; render(); }

function restartAll(){
  const snap = {
    1: MODES.map((_,i) => adjStar(1,i)),
    2: MODES.map((_,i) => adjStar(2,i)),
  };
  if(calcScore(1) > 0) history.push(snap);
  gLvl=1; cur=0; screen='start';
  mcSel        = {1:[[],[],[],[],[]], 2:[[],[],[],[],[]]};
  mcChecked    = {1:Array(5).fill(false), 2:Array(5).fill(false)};
  reflect      = {1:Array(5).fill(''),   2:Array(5).fill('')};
  peerChecks   = {1:Array(5).fill(null), 2:Array(5).fill(null)};
  peerComments = {1:Array(5).fill(''),   2:Array(5).fill('')};
  hintsUsed    = {1:Array(5).fill(false),2:Array(5).fill(false)};
  hintsShown   = {1:Array(5).fill(false),2:Array(5).fill(false)};
  render();
}

/* ── Boot ── */
render();
</script>
</body>
</html>
