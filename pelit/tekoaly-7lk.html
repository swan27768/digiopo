// Logiikka: onko tekoälyn väite TOSI? (kieliriippumaton)
const META = [
  { aiTrue: false },
  { aiTrue: true },
  { aiTrue: false },
  { aiTrue: true },
  { aiTrue: false },
  { aiTrue: true }
];
const MASCOT = "../images/robo_maskotti_7lk.webp";
const TOTAL = META.length;

let view = 'cover';   // 'cover' | 'round' | 'result'
let idx = 0;          // nykyinen kierros
let answered = false; // onko nykyiseen kierrokseen vastattu
let answers = [];     // käyttäjän vastaukset (true = sanoi "oikein")

function esc(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

function paivitaProgress() {
  var fill = document.getElementById('progressFill');
  var label = document.getElementById('progressLabel');
  var wrap = document.getElementById('progressWrap');
  if (!fill || !label || !wrap) return;
  var pct = 0, txt = '';
  if (view === 'cover') { pct = 0; txt = T('cover.title'); }
  else if (view === 'round') { pct = Math.round((idx / (TOTAL + 1)) * 100); txt = T('round.progress') + ' ' + (idx + 1) + ' / ' + TOTAL; }
  else { pct = 100; txt = '✓'; }
  fill.style.width = pct + '%';
  label.textContent = txt;
  wrap.setAttribute('aria-valuenow', pct);
}

function render() {
  var stage = document.getElementById('stage');
  if (!stage) return;
  if (view === 'cover') renderCover(stage);
  else if (view === 'round') renderRound(stage);
  else renderResult(stage);
  paivitaProgress();
  stage.setAttribute('tabindex', '-1');
  try { stage.focus({ preventScroll: true }); } catch (e) { /* ignore */ }
}

function renderCover(stage) {
  var rules = T('cover.rules') || [];
  var lis = '';
  for (var i = 0; i < rules.length; i++) lis += '<li>' + esc(rules[i]) + '</li>';
  stage.innerHTML =
    '<div class="cover-card">' +
      '<div class="cover-badge">' + esc(T('cover.badge')) + '</div>' +
      '<img src="' + MASCOT + '" alt="Robo" style="width:100px;margin:0 auto 12px;display:block;" onerror="this.style.display=\'none\'" />' +
      '<h1>' + esc(T('cover.title')) + '</h1>' +
      '<p style="margin-bottom:12px;">' + esc(T('cover.lead')) + '</p>' +
      '<p style="font-weight:700;color:var(--color-primary);margin-bottom:6px;">' + esc(T('cover.rulesTitle')) + '</p>' +
      '<ul class="rule-list">' + lis + '</ul>' +
      '<div class="btn-row" style="justify-content:center;margin-top:18px;">' +
        '<button class="btn-primary" id="startBtn">' + esc(T('cover.start')) + '</button>' +
      '</div>' +
    '</div>';
  var s = document.getElementById('startBtn');
  if (s) s.onclick = function () { view = 'round'; idx = 0; answered = false; render(); };
}

function renderRound(stage) {
  var r = (T('rounds') || [])[idx] || {};
  var chosen = answers[idx]; // true/false tai undefined
  stage.innerHTML =
    '<div class="card active">' +
      '<div class="chapter-tag">' + esc(T('cover.badge')) + ' · ' + esc(T('round.tag')) + ' ' + (idx + 1) + ' ' + esc(T('round.of')) + ' ' + TOTAL + '</div>' +
      '<p class="q-meta">' + esc(T('round.topicLabel')) + ' <strong>' + esc(r.topic) + '</strong></p>' +
      '<div class="ai-answer">' +
        '<span class="ai-tag">🤖 ' + esc(T('round.aiTag')) + '</span>' +
        '<div>' + esc(r.ai) + '</div>' +
      '</div>' +
      '<h2>' + esc(T('round.question')) + '</h2>' +
      '<div class="choice-row" id="choiceRow">' +
        '<button class="choice-btn pick-yes" data-pick="yes">' + esc(T('round.yes')) + '</button>' +
        '<button class="choice-btn pick-no" data-pick="no">' + esc(T('round.no')) + '</button>' +
      '</div>' +
      '<div class="feedback" id="feedback"></div>' +
      '<div class="btn-row" id="nextRow" style="display:none;">' +
        '<button class="btn-primary" id="nextBtn">' + esc(idx === TOTAL - 1 ? T('round.last') : T('round.next')) + '</button>' +
      '</div>' +
    '</div>';

  var buttons = stage.querySelectorAll('.choice-btn');
  for (var i = 0; i < buttons.length; i++) {
    buttons[i].onclick = function () { vastaa(this.getAttribute('data-pick') === 'yes'); };
  }
  // Jos kierrokseen on jo vastattu (esim. kielenvaihto kesken), näytä tila uudelleen
  if (chosen !== undefined) naytaVastaus(chosen, true);

  var nb = document.getElementById('nextBtn');
  if (nb) nb.onclick = function () {
    if (idx < TOTAL - 1) { idx++; answered = false; render(); }
    else { view = 'result'; render(); }
  };
}

function vastaa(sanoiOikein) {
  if (answered) return;
  answered = true;
  answers[idx] = sanoiOikein;
  naytaVastaus(sanoiOikein, false);
}

function naytaVastaus(sanoiOikein, hiljainen) {
  var r = (T('rounds') || [])[idx] || {};
  var aiTrue = META[idx].aiTrue;
  var oikein = (sanoiOikein === aiTrue);
  var row = document.getElementById('choiceRow');
  var fb = document.getElementById('feedback');
  var nextRow = document.getElementById('nextRow');
  if (!row || !fb || !nextRow) return;

  var btns = row.querySelectorAll('.choice-btn');
  for (var i = 0; i < btns.length; i++) {
    var pickYes = btns[i].getAttribute('data-pick') === 'yes';
    btns[i].disabled = true;
    // Merkitse oikea totuus vihreäksi, väärä valinta punaiseksi
    if (pickYes === aiTrue) btns[i].classList.add('correct');
    if (pickYes === sanoiOikein && !oikein) btns[i].classList.add('wrong');
    if (pickYes === sanoiOikein) btns[i].classList.add('chosen');
  }
  fb.className = 'feedback show ' + (oikein ? 'ok' : 'fail');
  fb.textContent = (oikein ? T('round.leadOk') : T('round.leadFail')) + r.fact;
  nextRow.style.display = 'flex';
}

function renderResult(stage) {
  var oikeat = 0;
  for (var i = 0; i < TOTAL; i++) {
    if (answers[i] === META[i].aiTrue) oikeat++;
  }
  var gradeClass, gradeText;
  if (oikeat >= 5) { gradeClass = 'erinomainen'; gradeText = T('result.gradeHigh'); }
  else if (oikeat >= 3) { gradeClass = 'hyva'; gradeText = T('result.gradeMid'); }
  else { gradeClass = 'harjoitellaan'; gradeText = T('result.gradeLow'); }

  var rounds = T('rounds') || [];
  var review = '';
  for (var j = 0; j < TOTAL; j++) {
    var r = rounds[j] || {};
    var ok = (answers[j] === META[j].aiTrue);
    var yourTxt = answers[j] === true ? T('result.answeredYes') : (answers[j] === false ? T('result.answeredNo') : '–');
    review +=
      '<div class="review-item ' + (ok ? 'ok' : 'fail') + '">' +
        '<div class="review-q">' + (ok ? '✅' : '❌') + ' ' + esc(r.topic) + '</div>' +
        '<div style="font-size:0.9em;margin-bottom:2px;">🤖 ' + esc(r.ai) + '</div>' +
        '<div style="font-size:0.85em;color:#555;">' + esc(T('result.yourAnswer')) + ' ' + esc(yourTxt) + '</div>' +
        '<div style="font-size:0.88em;color:#333;margin-top:4px;">' + esc(r.fact) + '</div>' +
      '</div>';
  }

  stage.innerHTML =
    '<div class="result-card show">' +
      '<div class="result-badge">' + esc(T('result.badge')) + '</div>' +
      '<img src="' + MASCOT + '" alt="Robo" style="width:80px;margin:0 auto 12px;display:block;" onerror="this.style.display=\'none\'" />' +
      '<div class="result-score">' + oikeat + '</div>' +
      '<div class="result-max">' + esc(T('result.max')) + '</div>' +
      '<div class="result-grade ' + gradeClass + '">' + esc(gradeText) + '</div>' +
      '<div class="feedback info show" style="text-align:left;">' + esc(T('result.takeaway')) + '</div>' +
      '<div class="review-section"><h3>' + esc(T('result.reviewTitle')) + '</h3>' + review + '</div>' +
      '<div class="btn-row" style="justify-content:center;margin-top:20px;">' +
        '<button class="btn-primary" id="retryBtn">' + esc(T('result.retry')) + '</button>' +
        '<a href="' + esc(T('result.backHref')) + '"><button class="btn-primary btn-secondary">' + esc(T('result.back')) + '</button></a>' +
      '</div>' +
    '</div>';

  var rb = document.getElementById('retryBtn');
  if (rb) rb.onclick = function () { answers = []; idx = 0; answered = false; view = 'cover'; render(); };
}

// Käynnistä i18n ja piirrä
TekoalyI18n.init({
  langs: ['fi', 'sv', 'en'],
  labels: { fi: 'FI', sv: 'SV', en: 'EN' },
  dict: LANG,
  barSelector: '#langBar',
  onChange: render
});
</script>
