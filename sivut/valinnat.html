<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Mitä sitten? — korttipeli valinnoista</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap');
*{box-sizing:border-box;margin:0;padding:0;}
html,body{background:#fff;color:#1a1a2e;font-family:'Nunito',sans-serif;min-height:100%;}
#g{padding:1rem;max-width:620px;margin:0 auto;background:#fff;}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);}

.intro{max-width:400px;margin:0 auto;padding:1.5rem 0;}
.intro-title{font-size:34px;font-family:'Fredoka One',sans-serif;color:#1a1a2e;margin-bottom:.3rem;}
.intro-hook{font-size:15px;color:#3a3a3a;font-style:italic;margin-bottom:1.5rem;line-height:1.65;}
.intro-section{margin-bottom:1.1rem;}
.intro-section-title{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:#3C3489;margin-bottom:.4rem;}
.intro-section-text{font-size:15px;color:#222;line-height:1.7;}
.intro-divider{border:none;border-top:1px solid #ddd;margin:1.25rem 0;}
.card-deco-row{display:flex;gap:8px;margin-bottom:1.5rem;justify-content:center;}
.mini-card{width:46px;height:64px;border-radius:8px;border:2px solid rgba(0,0,0,.15);display:flex;align-items:center;justify-content:center;font-size:22px;}

.setup{max-width:360px;margin:0 auto;padding:1rem 0;}
.setup-title{font-size:24px;font-family:'Fredoka One',sans-serif;color:#1a1a2e;margin-bottom:.2rem;}
.setup-sub{font-size:15px;color:#444;margin-bottom:1.25rem;}
.slabel{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#555;margin-bottom:.5rem;margin-top:.9rem;}
.pc-row{display:flex;gap:8px;margin-bottom:.25rem;}
.pc-btn{flex:1;padding:.6rem;border:2px solid #bbb;border-radius:10px;background:#fff;cursor:pointer;font-size:15px;font-family:'Nunito',sans-serif;font-weight:700;color:#1a1a2e;}
.pc-btn.on{border-color:#3C3489;background:#EEEDFE;color:#26215C;}
.pc-btn:hover{background:#f0f0f0;}
.name-inputs{display:flex;flex-direction:column;gap:8px;margin-bottom:.5rem;}
.name-row{display:flex;align-items:center;gap:8px;}
.ndot{width:11px;height:11px;border-radius:50%;flex-shrink:0;}
.name-inputs input{flex:1;padding:.6rem .8rem;border:2px solid #bbb;border-radius:10px;font-size:15px;font-family:'Nunito',sans-serif;font-weight:600;background:#fff;color:#1a1a2e;}
.name-inputs input:focus{outline:3px solid #3C3489;border-color:#3C3489;}
.back-link{text-align:center;margin-top:.75rem;font-size:13px;color:#555;cursor:pointer;text-decoration:underline;}

.primary-btn{width:100%;padding:.85rem;border:none;border-radius:12px;background:#3C3489;color:#fff;cursor:pointer;font-size:16px;font-family:'Fredoka One',sans-serif;letter-spacing:.02em;}
.primary-btn:hover{background:#26215C;}
.primary-btn.green{background:#085041;}
.primary-btn.green:hover{background:#04342C;}

/* HUD */
.hud{margin-bottom:.75rem;}
.hud-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:.5rem;flex-wrap:wrap;gap:6px;}
.player-tabs{display:flex;gap:5px;flex-wrap:wrap;}
.ptab{font-size:12px;font-weight:800;padding:5px 12px;border-radius:99px;border:2px solid #ddd;color:#555;background:#f5f5f5;}
.ptab.active{border-color:currentColor;}

/* Pokerikortti — aina näkyvissä */
.poker-bar{display:flex;align-items:center;gap:8px;background:#EEEDFE;border:2px solid #3C3489;border-radius:10px;padding:8px 12px;margin-bottom:.65rem;}
.poker-bar-icon{font-size:18px;}
.poker-bar-text{font-size:13px;font-weight:700;color:#26215C;flex:1;}
.poker-bar-btn{padding:5px 14px;border:none;border-radius:8px;background:#3C3489;color:#fff;cursor:pointer;font-size:13px;font-family:'Fredoka One',sans-serif;}
.poker-bar-btn:hover{background:#26215C;}
.poker-bar-btn:disabled{opacity:.4;cursor:default;}
.poker-bar.used{background:#f5f5f5;border-color:#ddd;}
.poker-bar.used .poker-bar-text{color:#aaa;}

/* Pisteet piilotettu */
.stats-hidden{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;}
.sp-hidden{background:#f5f5f5;border-radius:8px;padding:6px 8px;text-align:center;border:1px solid #e5e5e5;}
.sp-hidden-label{font-size:12px;font-weight:700;color:#aaa;margin-bottom:2px;}
.sp-hidden-val{font-size:16px;font-weight:800;color:#ddd;}

.rrow{display:flex;align-items:center;justify-content:space-between;margin-bottom:.7rem;font-size:13px;font-weight:700;color:#444;}
.pips{display:flex;gap:4px;flex-wrap:wrap;}
.pip{width:10px;height:10px;border-radius:50%;background:#ddd;}
.pip.done{background:#085041;}.pip.active{background:#3C3489;}.pip.surp{background:#BA7517;}

.play-area{display:flex;align-items:flex-start;gap:1rem;}
.deck-wrap{display:flex;flex-direction:column;align-items:center;gap:8px;flex-shrink:0;}
.deck-stack{position:relative;width:82px;height:118px;cursor:pointer;}
.ds1{position:absolute;top:6px;left:2px;width:80px;height:116px;border-radius:12px;background:#7F77DD;}
.ds2{position:absolute;top:3px;left:1px;width:80px;height:116px;border-radius:12px;background:#AFA9EC;}
.dtop{position:absolute;top:0;left:0;width:80px;height:116px;border-radius:12px;background:#3C3489;border:2px solid #26215C;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;transition:transform .15s;}
.dtop:hover{transform:translateY(-4px);}
.dtop-icon{font-size:24px;color:#fff;}
.dtop-count{font-size:11px;font-weight:800;color:rgba(255,255,255,.9);}
.shuf-btn{display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;opacity:.7;transition:opacity .15s;}
.shuf-btn:hover{opacity:1;}
.shuf-icon{width:34px;height:34px;border-radius:50%;background:#f5f5f5;border:2px solid #ddd;display:flex;align-items:center;justify-content:center;font-size:15px;}
.shuf-label{font-size:11px;font-weight:800;color:#555;text-transform:uppercase;letter-spacing:.05em;}

.card-area{flex:1;min-height:300px;}
.gcard{border-radius:16px;padding:1.1rem;border:2.5px solid rgba(0,0,0,.12);position:relative;overflow:hidden;animation:cardIn .4s cubic-bezier(.22,1,.36,1);}
@keyframes cardIn{0%{opacity:0;transform:translateX(-60px) rotate(-5deg);}100%{opacity:1;transform:none;}}
.card-koulu    {background:#E6F1FB;border-color:#378ADD;}
.card-terveys  {background:#EAF3DE;border-color:#639922;}
.card-kaverit  {background:#EEEDFE;border-color:#7F77DD;}
.card-raha     {background:#FAEEDA;border-color:#BA7517;}
.card-rakkaus  {background:#FBEAF0;border-color:#D4537E;}
.card-tulevaisuus{background:#FAECE7;border-color:#D85A30;}
.card-ura      {background:#EAF3DE;border-color:#639922;}
.card-perhe    {background:#E6F1FB;border-color:#378ADD;}
.card-yllatys  {background:#FAEEDA;border-color:#BA7517;cursor:pointer;}
.card-digi     {background:#EEEDFE;border-color:#7F77DD;}
.card-vaikea   {background:#FBEAF0;border-color:#D4537E;}
.cdeco{position:absolute;top:-20px;right:-20px;width:72px;height:72px;border-radius:50%;opacity:.15;}
.ctag{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px;}
.cicon{font-size:28px;margin-bottom:3px;}
.ctitle{font-size:17px;font-family:'Fredoka One',sans-serif;line-height:1.25;color:#1a1a2e;margin-bottom:5px;}
.cdesc{font-size:13px;color:#222;line-height:1.6;margin-bottom:10px;}
.timer-bar-wrap{height:5px;background:rgba(0,0,0,.10);border-radius:3px;margin-bottom:8px;overflow:hidden;}
.timer-bar{height:5px;border-radius:3px;background:#3C3489;}

/* Vaikea-merkki kortissa */
.hard-badge{display:inline-block;font-size:10px;font-weight:800;padding:2px 8px;border-radius:99px;background:#FBEAF0;color:#993556;border:1px solid #D4537E;margin-left:6px;vertical-align:middle;}

.choices{display:flex;flex-direction:column;gap:6px;}
.chbtn{background:rgba(255,255,255,.85);border:2px solid rgba(0,0,0,.15);border-radius:10px;padding:9px 12px;font-size:13px;font-weight:700;color:#1a1a2e;cursor:pointer;text-align:left;line-height:1.4;transition:background .1s,transform .1s;font-family:'Nunito',sans-serif;}
.chbtn:hover:not(:disabled){background:#fff;transform:scale(1.01);}
.chbtn:focus{outline:3px solid #3C3489;outline-offset:2px;}
.chbtn:disabled{opacity:.5;cursor:default;}
.chbtn.chosen{background:#fff;border-width:2.5px;}

/* Pokeri */
.slow-down{background:#EEEDFE;border:2px solid #3C3489;border-radius:12px;padding:10px 14px;margin-bottom:8px;font-size:13px;font-weight:700;color:#26215C;line-height:1.5;animation:cardIn .3s ease;}
.slow-down-icon{font-size:18px;margin-right:4px;}
.poker-swap{background:#EEEDFE;border:2px dashed #3C3489;border-radius:10px;padding:10px 13px;margin-top:8px;font-size:13px;font-weight:700;color:#26215C;line-height:1.5;}
.poker-swap-label{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;display:block;margin-bottom:3px;}
.poker-swap-btns{display:flex;gap:8px;margin-top:8px;}
.poker-swap-btns button{flex:1;padding:.5rem;font-size:14px;}
.poker-perspective{background:#EEEDFE;border:2px solid #3C3489;border-radius:14px;padding:1rem 1.1rem;margin-top:8px;animation:cardIn .35s ease;}
.poker-perspective-label{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:#3C3489;margin-bottom:.5rem;display:block;}
.poker-who{font-size:12px;font-weight:800;color:#534AB7;margin-bottom:3px;}
.poker-quote{font-size:15px;font-style:italic;color:#26215C;line-height:1.55;margin-bottom:.85rem;padding-left:10px;border-left:3px solid #7F77DD;}
.poker-motive-label{font-size:12px;font-weight:800;color:#3C3489;margin-bottom:.5rem;display:block;}
.motive-btns{display:flex;flex-direction:column;gap:6px;}
.motive-btn{background:rgba(255,255,255,.8);border:1.5px solid #AFA9EC;border-radius:9px;padding:8px 11px;font-size:13px;font-weight:700;color:#26215C;cursor:pointer;text-align:left;font-family:'Nunito',sans-serif;}
.motive-btn:hover{background:#fff;border-color:#534AB7;}
.motive-btn.selected{background:#fff;border-color:#3C3489;border-width:2px;}

.surp-back{align-items:center;justify-content:center;text-align:center;min-height:260px;display:flex;flex-direction:column;gap:8px;}
.surp-icon-big{font-size:48px;}
.surp-title{font-size:20px;font-family:'Fredoka One',sans-serif;color:#633806;}
.surp-tap{font-size:13px;color:#854F0B;font-weight:700;}
.surp-result-box{border-radius:14px;padding:1rem 1.1rem;margin-bottom:8px;text-align:center;}
.surp-result-good{background:#EAF3DE;border:2.5px solid #639922;}
.surp-result-bad {background:#FCEBEB;border:2.5px solid #E24B4A;}
.surp-result-icon{font-size:36px;margin-bottom:6px;}
.surp-result-title{font-size:18px;font-family:'Fredoka One',sans-serif;margin-bottom:4px;}
.surp-result-good .surp-result-title{color:#173404;}
.surp-result-bad  .surp-result-title{color:#501313;}
.surp-result-text{font-size:13px;line-height:1.55;}
.surp-result-good .surp-result-text{color:#27500A;}
.surp-result-bad  .surp-result-text{color:#791F1F;}
.surp-delta-row{display:flex;justify-content:center;flex-wrap:wrap;gap:6px;margin-top:8px;}
.surp-delta{font-size:12px;font-weight:800;padding:3px 10px;border-radius:99px;}
.surp-delta.pos{background:#C0DD97;color:#173404;}
.surp-delta.neg{background:#F7C1C1;color:#501313;}

.ap-box{border-radius:10px;padding:10px 13px;margin-bottom:8px;font-size:13px;font-weight:700;line-height:1.5;}
.ap-warn{background:#FAEEDA;border:2px solid #BA7517;color:#412402;}
.ap-good{background:#EAF3DE;border:2px solid #639922;color:#173404;}
.ap-label{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;display:block;margin-bottom:3px;}

.reveal-box{background:#f5f5f5;border-radius:12px;padding:.85rem 1rem;margin-bottom:.75rem;border:1px solid #e0e0e0;}
.reveal-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid #e0e0e0;font-size:13px;}
.reveal-row:last-child{border-bottom:none;}
.rev-name{font-weight:800;color:#1a1a2e;}
.rev-choice{color:#333;max-width:55%;text-align:right;line-height:1.4;}

/* Kierroksen pisteet */
.round-stats-reveal{background:#fff;border:2px solid #3C3489;border-radius:14px;padding:1rem;margin-bottom:.75rem;animation:cardIn .35s ease;}
.round-stats-title{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:#3C3489;margin-bottom:.65rem;}
.round-delta-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;}
.rd-item{background:#f5f5f5;border-radius:8px;padding:6px 8px;text-align:center;}
.rd-label{font-size:11px;font-weight:700;color:#444;margin-bottom:2px;}
.rd-val{font-size:15px;font-weight:800;}
.rd-delta{font-size:11px;font-weight:800;margin-top:1px;}
.rd-delta.pos{color:#085041;}.rd-delta.neg{color:#791F1F;}
.rd-bar{height:4px;border-radius:2px;margin-top:3px;background:#ddd;}
.rd-fill{height:4px;border-radius:2px;}

/* END */
.end-screen{padding:.5rem 0;}
.end-title{font-size:24px;font-family:'Fredoka One',sans-serif;color:#1a1a2e;margin-bottom:.3rem;}
.end-sub{font-size:14px;color:#444;margin-bottom:1rem;}
.pres{border:2px solid #ddd;border-radius:14px;padding:.9rem 1rem;margin-bottom:.9rem;background:#fff;}
.pre-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:.65rem;}
.pre-name{font-size:16px;font-weight:800;}
.pre-total{font-size:13px;color:#444;font-weight:700;}
.pre-sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:.75rem;}
.pre-stat{border-radius:10px;padding:8px 6px;text-align:center;border:2px solid transparent;}
.prs-label{font-size:11px;font-weight:800;margin-bottom:3px;}
.prs-val{font-size:20px;font-weight:800;}
.prs-bar-bg{height:5px;border-radius:3px;margin-top:4px;background:rgba(0,0,0,.1);}
.prs-fill{height:5px;border-radius:3px;}
.chart-wrap{background:#f9f9f9;border-radius:10px;padding:.85rem 1rem;margin-bottom:.6rem;border:1px solid #e8e8e8;}
.chart-label{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:#444;margin-bottom:.5rem;}
.chart-legend{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:.5rem;}
.cleg{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:700;color:#333;}
.cleg-dot{width:9px;height:9px;border-radius:50%;}
.story-box{background:#f9f9f9;border-radius:10px;padding:.85rem 1rem;border:1px solid #e8e8e8;}
.story-label{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:#444;margin-bottom:.5rem;}
.story-text{font-size:13px;color:#222;line-height:1.65;}
.trend-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:.5rem;}
.tpill{font-size:12px;font-weight:800;padding:4px 11px;border-radius:99px;}
.tup{background:#1D9E75;color:#fff;}.tdown{background:#E24B4A;color:#fff;}.tflat{background:#888780;color:#fff;}
.strength-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:.6rem;}
.strength-box{border-radius:10px;padding:.75rem .9rem;}
.strength-box.pos{background:#EAF3DE;border:1.5px solid #639922;}
.strength-box.neg{background:#FCEBEB;border:1.5px solid #E24B4A;}
.strength-label{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;margin-bottom:.4rem;display:block;}
.strength-box.pos .strength-label{color:#27500A;}
.strength-box.neg .strength-label{color:#501313;}
.strength-item{display:flex;align-items:center;gap:6px;margin-bottom:3px;font-size:13px;font-weight:700;}
.strength-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.moment-box{border-radius:10px;padding:.75rem .9rem;background:#FAEEDA;border:1.5px solid #BA7517;margin-bottom:.6rem;}
.moment-label{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:#633806;margin-bottom:.4rem;display:block;}
.moment-card{font-size:14px;font-weight:800;color:#412402;margin-bottom:3px;}
.moment-choice{font-size:12px;color:#633806;margin-bottom:.4rem;line-height:1.4;}
.moment-delta{display:flex;flex-wrap:wrap;gap:5px;}
.moment-delta span{font-size:11px;font-weight:800;padding:2px 8px;border-radius:99px;}
.moment-delta .pos{background:#C0DD97;color:#173404;}
.moment-delta .neg{background:#F7C1C1;color:#501313;}

@keyframes dshake{0%,100%{transform:rotate(0);}20%{transform:rotate(-4deg);}40%{transform:rotate(4deg);}60%{transform:rotate(-2deg);}80%{transform:rotate(2deg);}}

/* Reflektiokysymys */
.reflect-screen{padding:1.5rem 0;max-width:420px;margin:0 auto;}
.reflect-title{font-size:22px;font-family:'Fredoka One',sans-serif;color:#1a1a2e;margin-bottom:.4rem;}
.reflect-sub{font-size:14px;color:#444;line-height:1.6;margin-bottom:1.25rem;}
.reflect-divider{border:none;border-top:1px solid #ddd;margin:1rem 0;}
.reflect-q{font-size:15px;font-weight:800;color:#1a1a2e;margin-bottom:.75rem;}
.reflect-opts{display:flex;flex-direction:column;gap:8px;margin-bottom:.85rem;}
.reflect-opt{background:#f5f5f5;border:2px solid #ddd;border-radius:11px;padding:10px 14px;font-size:14px;font-weight:700;color:#1a1a2e;cursor:pointer;text-align:left;font-family:'Nunito',sans-serif;transition:background .1s,border-color .1s;}
.reflect-opt:hover{background:#EEEDFE;border-color:#7F77DD;}
.reflect-opt.sel{background:#EEEDFE;border-color:#3C3489;color:#26215C;}
.reflect-why-label{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:#444;margin-bottom:.4rem;display:block;}
.reflect-textarea{width:100%;border:2px solid #ddd;border-radius:11px;padding:.7rem .9rem;font-size:14px;font-family:'Nunito',sans-serif;font-weight:600;color:#1a1a2e;resize:none;min-height:80px;background:#fff;}
.reflect-textarea:focus{outline:3px solid #3C3489;border-color:#3C3489;}
.reflect-answer-box{background:#EEEDFE;border:1.5px solid #AFA9EC;border-radius:10px;padding:.75rem 1rem;margin-top:8px;}
.reflect-answer-label{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:#3C3489;margin-bottom:.3rem;display:block;}
.reflect-answer-text{font-size:13px;color:#26215C;font-weight:700;line-height:1.55;font-style:italic;}

</style>

  <h1 class="sr-only">Mitä sitten? — korttipeli valinnoista</h1>

<script>
const STATS=[
  {key:"terveys",    label:"Terveys",     color:"#185FA5",bg:"#E6F1FB",border:"#378ADD"},
  {key:"raha",       label:"Raha",        color:"#EF9F27",bg:"#FAEEDA",border:"#BA7517"},
  {key:"sosiaaliset",label:"Sosiaaliset", color:"#534AB7",bg:"#EEEDFE",border:"#7F77DD"},
  {key:"empatia",    label:"Empatia",     color:"#D4537E",bg:"#FBEAF0",border:"#D4537E"},
  {key:"itseilmaisu",label:"Itseilmaisu", color:"#1D9E75",bg:"#EAF3DE",border:"#639922"},
  {key:"sinnikkyys", label:"Sinnikkyys",  color:"#E24B4A",bg:"#FCEBEB",border:"#E24B4A"},
  {key:"rohkeus",    label:"Rohkeus",     color:"#D85A30",bg:"#FAECE7",border:"#D85A30"},
  {key:"rakkaus",    label:"Rakkaus",     color:"#A32D2D",bg:"#FCEBEB",border:"#E24B4A"},
  {key:"organisointi",label:"Organisointi",color:"#26215C",bg:"#EEEDFE",border:"#534AB7"},
];

function buildQ(){
  const th=RECURRING[Math.floor(Math.random()*RECURRING.length)];
  const surp=SURPRISES[Math.floor(Math.random()*SURPRISES.length)];
  // Sekoita singles, erota vaikeat erikseen
  const hardCards=SINGLES.filter(c=>c.hard).sort(()=>Math.random()-.5);
  const normalCards=SINGLES.filter(c=>!c.hard).sort(()=>Math.random()-.5);
  // Tarvitaan 4 kierrosta × 5 korttia = 20 korttia
  // Rakenne per kierros: [rec, normal, normal, normal, normal]
  // + 1 yllätyskorttti kierroksella 2 (korvaa yhden normalin)
  // + 1-2 vaikeaa korttia kierroksilla 3-4
  const q=[];
  let ni=0,hi=0;
  for(let r=0;r<ROUNDS;r++){
    // Toistuvat kierros r:lle (0,1,2) — kierros 3 käyttää taas 0:ta jos loppuu
    const recCard={...th.cards[Math.min(r,2)],type:"normal",rec:true,recR:Math.min(r,2)+1};
    q.push(recCard);
    // Muut 4 paikkaa
    for(let s=0;s<PER-1;s++){
      // Kierros 1 (r=1), paikka 3: yllätyskorttti
      if(r===1&&s===2){
        q.push({type:"surprise",tag:"yllatys",icon:"✦",title:"Yllätyskorttti",surp});
        continue;
      }
      // Kierros 2-3 (r=2,3): 1 vaikea kortti per kierros
      if((r===2||r===3)&&s===3&&hi<hardCards.length){
        q.push({...hardCards[hi++],type:"normal",rec:false});
        continue;
      }
      if(ni<normalCards.length) q.push({...normalCards[ni++],type:"normal",rec:false});
    }
  }
  return q;
}

function pick(pi,cho){
  if(rChoices[pi]!==undefined)return;

  // Varoitus jos valittu alle 5 sekunnissa
  const elapsed=(Date.now()-cardStartTime)/1000;
  if(elapsed<5&&queue[ci].type==="normal"){
    // Näytä varoitus — estä valinta hetkeksi
    const existing=document.getElementById("slow-down-msg");
    if(!existing){
      const warn=document.createElement("div");
      warn.className="slow-down";warn.id="slow-down-msg";
      warn.innerHTML=`<span class="slow-down-icon">⏸</span>Hidasta. Oikeassa elämässä et voi klikata ohi.`;
      const cardArea=document.querySelector(".card-area");
      if(cardArea) cardArea.insertBefore(warn,cardArea.firstChild);
      // Poistetaan varoitus 2 sekunnin kuluttua
      setTimeout(()=>document.getElementById("slow-down-msg")?.remove(),2000);
    }
    return; // Estä valinta
  }

  rChoices[pi]=cho;
  if(cho===0)apCounts[pi]++;else apCounts[pi]=0;
  const bon=recBonus(pi,cho);
  const base={...queue[ci].d[cho]};
  if(bon>0){const mk=Object.keys(base)[0];if(mk)base[mk]=(base[mk]||0)+bon;}
  players[pi]._bon=bon;players[pi]._auto=apCounts[pi]>=3;
  pDeltas[pi]=base;
  Object.entries(base).forEach(([k,v])=>{pendingRoundDeltas[pi][k]=(pendingRoundDeltas[pi][k]||0)+v;});
  players[pi].hist.push({ci,cho,rec:!!queue[ci].rec});
  const rem=players.findIndex((_,i)=>rChoices[i]===undefined);
  if(rem===-1){
    if(players.length===1)renderGame();
    else{showReveal();}
  }else{curP=rem;renderGame();}
}

function activPoker(){
  // Nollaa valinta, merkitse pokeri käytetyksi
  pokerUsed[curP]=true;
  const oldBase=pDeltas[curP]||{};
  // Peru pending round deltat
  Object.entries(oldBase).forEach(([k,v])=>{pendingRoundDeltas[curP][k]=(pendingRoundDeltas[curP][k]||0)-v;});
  delete rChoices[curP];delete pDeltas[curP];players[curP]._bon=0;
  renderGame();
}

function checkAfterChoice(){
  const isLastInRound=(ci%PER===PER-1)||(queue[ci].type==="surprise");
  if(isLastInRound) applyAndShowRoundStats();
  else applyAndNext();
}

function recBonus(pi,cho){
  const c=queue[ci];if(!c.rec)return 0;
  const prev=players[pi].hist.filter(h=>h.rec);if(prev.length===0)return 0;
  return(prev.every(h=>h.cho===0)&&cho===0)?prev.length:0;
}

function doSurprise(){
  const s=queue[ci].surp;

  // Lasketaan pelaajan "suunta" ennen yllätyskortttia
  // Positiivinen valinta = choice index 0, negatiivinen = 2
  // Tulos: goodChance 0.2 - 0.8 riippuen valinnoista
  function calcGoodChance(pi){
    const hist=players[pi].hist;
    if(hist.length===0) return .5;
    const score=hist.reduce((sum,h)=>{
      if(h.cho===0) return sum+1;      // positiivinen valinta
      if(h.cho===2) return sum-1;      // negatiivinen valinta
      return sum;                       // neutraali
    },0);
    const normalized=score/hist.length; // -1 … +1
    return Math.min(.8,Math.max(.2,.5+normalized*.3));
  }

  players.forEach((p,i)=>{
    const chance=calcGoodChance(i);
    const good=Math.random()<chance;
    const res=good?s.good:s.bad;
    pDeltas[i]=res.d;rChoices[i]=0;
    Object.entries(res.d).forEach(([k,v])=>{pendingRoundDeltas[i][k]=(pendingRoundDeltas[i][k]||0)+v;});
    players[i]._surpriseGood=good;
    players[i]._surpriseRes=res;
    players[i]._surpriseChance=Math.round(chance*100);
  });
  surpriseOk=true;

  // Näytä ensimmäisen pelaajan tulos (solo) tai yhteinen
  const good=players[0]._surpriseGood;
  const res=players[0]._surpriseRes;
  const chance=players[0]._surpriseChance;

  const deltas=Object.entries(res.d).map(([k,v])=>{
    const st=STATS.find(s=>s.key===k);
    return`<span class="surp-delta ${v>0?"pos":"neg"}">${st?st.label:k} ${v>0?"+":""}${v}</span>`;
  }).join("");

  // Selitys miksi tämä tulos
  const chanceNote=chance>=60
    ? `<div style="font-size:12px;color:#27500A;margin-bottom:8px;font-style:italic">Valintasi ennen tätä olivat pääosin positiivisia — se vaikutti.</div>`
    : chance<=40
    ? `<div style="font-size:12px;color:#791F1F;margin-bottom:8px;font-style:italic">Valintasi ennen tätä olivat haastavia — se vaikutti.</div>`
    : `<div style="font-size:12px;color:#555;margin-bottom:8px;font-style:italic">Elämässä tulee yllätyksiä — et voi aina valita, mutta voit valita miten reagoit.</div>`;

  document.querySelector(".card-area").innerHTML=`
    <div class="surp-result-box ${good?"surp-result-good":"surp-result-bad"}">
      <div class="surp-result-icon">${good?"🌟":"⚡"}</div>
      <div class="surp-result-title">${good?"Hyvä yllätys!":"Ikävä yllätys!"}</div>
      <div class="surp-result-text">${res.text}</div>
      <div class="surp-delta-row">${deltas}</div>
    </div>
    ${chanceNote}
    <button class="primary-btn" id="nxt-round">Katso kierroksen pisteet →</button>`;
  document.getElementById("nxt-round").addEventListener("click",applyAndShowRoundStats);
}

function applyAndNext(){

  });
  pDeltas={};ci++;
  if(ci>=queue.length){renderEnd();return;}

function buildChart(p){
  const snaps=p.snapshots;const n=snaps.length;
  const W=300,H=100,PL=28,PR=8,PT=12,PB=8;const gW=W-PL-PR,gH=H-PT-PB;
  const variances=STATS.map(s=>{const vals=snaps.map(sn=>sn[s.key]);return{s,range:Math.max(...vals)-Math.min(...vals)};}).sort((a,b)=>b.range-a.range);
  const shown=variances.slice(0,4).map(v=>v.s);
  const allVals=shown.flatMap(s=>snaps.map(sn=>sn[s.key]));
  const minY=Math.min(...allVals),maxY=Math.max(...allVals),rangeY=Math.max(maxY-minY,2);
  function px(i){return PL+Math.round(i/(n-1)*gW);}
  function py(v){return PT+Math.round((1-(v-minY)/rangeY)*gH);}
  const lines=shown.map(s=>`<polyline points="${snaps.map((sn,i)=>`${px(i)},${py(sn[s.key])}`).join(" ")}" fill="none" stroke="${s.color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>${snaps.map((sn,i)=>`<circle cx="${px(i)}" cy="${py(sn[s.key])}" r="3.5" fill="${s.color}"/>`).join("")}`).join("");
  const yLines=[minY,Math.round((minY+maxY)/2),maxY].map(v=>`<line x1="${PL}" x2="${W-PR}" y1="${py(v)}" y2="${py(v)}" stroke="#ddd" stroke-width="1"/><text x="${PL-4}" y="${py(v)+4}" text-anchor="end" font-size="10" fill="#555" font-family="Nunito,sans-serif" font-weight="700">${v}</text>`).join("");
  const legend=shown.map(s=>`<div class="cleg"><div class="cleg-dot" style="background:${s.color}"></div>${s.label}</div>`).join("");
  return`<div class="chart-wrap"><div class="chart-label">Kehitys kierros kierrokselta</div><div class="chart-legend">${legend}</div><svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block;" role="img">${yLines}${lines}</svg></div>`;
}

function buildStrengths(p){
  const sorted=[...STATS].sort((a,b)=>p.stats[b.key]-p.stats[a.key]);
  const strong=sorted.slice(0,3);
  const weak=sorted.slice(-3).reverse();
  const strongItems=strong.map(s=>`<div class="strength-item"><div class="strength-dot" style="background:${s.color}"></div>${s.label} <span style="color:${s.color};margin-left:auto">${p.stats[s.key]}</span></div>`).join("");
  const weakItems=weak.map(s=>`<div class="strength-item"><div class="strength-dot" style="background:${s.color}"></div>${s.label} <span style="color:${s.color};margin-left:auto">${p.stats[s.key]}</span></div>`).join("");
  return`<div class="strength-grid">
    <div class="strength-box pos"><span class="strength-label">💪 Vahvuutesi</span>${strongItems}</div>
    <div class="strength-box neg"><span class="strength-label">🌱 Kehitysalueesi</span>${weakItems}</div>
  </div>`;
}

function buildMoment(p){
  // Löydä kortti jossa pisteet muuttuivat eniten yhden kierroksen aikana
  if(p.snapshots.length<2) return"";
  let maxChange=0,maxIdx=0;
  for(let i=1;i<p.snapshots.length;i++){
    const change=STATS.reduce((sum,s)=>sum+Math.abs(p.snapshots[i][s.key]-p.snapshots[i-1][s.key]),0);
    if(change>maxChange){maxChange=change;maxIdx=i;}
  }
  if(maxChange===0) return"";
  // Kortti on indeksissä maxIdx-1 (snapshot i vastaa korttia i-1)
  const cardIdx=maxIdx-1;
  const card=p.hist[cardIdx];
  if(!card) return"";
  const queueCard=queue[card.ci];
  if(!queueCard||!queueCard.choices) return"";
  const chosen=queueCard.choices[card.cho];
  const before=p.snapshots[maxIdx-1];const after=p.snapshots[maxIdx];
  const deltas=STATS.map(s=>({s,d:after[s.key]-before[s.key]})).filter(x=>x.d!==0);
  const deltaHTML=deltas.map(x=>`<span class="${x.d>0?"pos":"neg"}">${x.s.label} ${x.d>0?"+":""}${x.d}</span>`).join("");
  return`<div class="moment-box">
    <span class="moment-label">⚡ Tämä valinta vaikutti eniten</span>
    <div class="moment-card">${queueCard.title}</div>
    <div class="moment-choice">Valitsit: "${chosen}"</div>
    <div class="moment-delta">${deltaHTML}</div>
  </div>`;
}

      <div class="reflect-opts" id="ropts">
        ${REFLECT_OPTS.map((o,i)=>`<button class="reflect-opt" data-i="${i}">${o}</button>`).join("")}
      </div>
      <span class="reflect-why-label">Tai kirjoita omin sanoin</span>
      <textarea class="reflect-textarea" id="rtxt" placeholder="Kirjoita tähän..."></textarea>
      <button class="primary-btn" id="reflect-done" style="margin-top:.85rem">Katso tulokset →</button>
    </div>`;

  let selIdx=null;
  document.querySelectorAll(".reflect-opt").forEach(btn=>{
    btn.addEventListener("click",()=>{
      document.querySelectorAll(".reflect-opt").forEach(b=>b.classList.remove("sel"));
      btn.classList.add("sel");
      selIdx=parseInt(btn.dataset.i);
      document.getElementById("rtxt").value="";
    });
  });
  document.getElementById("rtxt").addEventListener("input",()=>{
    document.querySelectorAll(".reflect-opt").forEach(b=>b.classList.remove("sel"));
    selIdx=null;
  });
  document.getElementById("reflect-done").addEventListener("click",()=>{
    const txt=document.getElementById("rtxt").value.trim();
    const answer=txt||(selIdx!==null?REFLECT_OPTS[selIdx]:null);
    players.forEach(p=>p.reflectAnswer=answer||null);
    renderEnd();
  });
}

function renderEnd(){
  const solo=players.length===1;
  const sorted=[...players].sort((a,b)=>Object.values(b.stats).reduce((x,y)=>x+y,0)-Object.values(a.stats).reduce((x,y)=>x+y,0));
  document.getElementById("ui").innerHTML=`
    <div class="end-screen">
      <div class="end-title">Mihin suuntaan olet menossa?</div>
      <div class="end-sub">Katso miten valintasi kehittyivät kierros kierrokselta.</div>
      ${sorted.map((p,rank)=>{
        const total=Object.values(p.stats).reduce((a,b)=>a+b,0);
        const trends={};STATS.forEach(s=>{const d=p.stats[s.key]-START;trends[s.key]=d>=3?"up":d<=-3?"down":"flat";});
        const rH=p.hist.filter(h=>h.rec);
        const rOk=rH.length>=2&&rH.every(h=>h.cho===0);
        const rBad=rH.length>=2&&rH.every(h=>h.cho>=1);
        const ups=STATS.filter(s=>trends[s.key]==="up").map(s=>s.label);
        const downs=STATS.filter(s=>trends[s.key]==="down").map(s=>s.label);
        let story="";
        if(rOk)story+="Teit saman valinnan kolme kertaa — se on jo tapa. ";
        if(rBad)story+="Toistuva tilanne tuli kolmesti, mutta valintasi ei pysynyt johdonmukaisena. ";
        if(ups.length)story+=`${ups.join(", ")} kasvoi — olet menossa eteenpäin näillä alueilla. `;
        if(downs.length)story+=`${downs.join(", ")} laski — nämä kaipaavat huomiota. `;
        if(!story)story="Pisteet pysyivät melko tasaisina. Suuri muutos syntyy johdonmukaisista pienistä teoista.";
        const pills=STATS.map(s=>`<span class="tpill ${trends[s.key]==="up"?"tup":trends[s.key]==="down"?"tdown":"tflat"}">${trends[s.key]==="up"?"↑":trends[s.key]==="down"?"↓":"→"} ${s.label}</span>`).join("");
        const sgrid=STATS.map(s=>`
          <div class="pre-stat" style="background:${s.bg};border-color:${s.border}">
            <div class="prs-label" style="color:${s.color}">${s.label}</div>
            <div class="prs-val" style="color:${s.color}">${p.stats[s.key]}</div>
            <div class="prs-bar-bg"><div class="prs-fill" style="width:${Math.round(p.stats[s.key]/MAX*100)}%;background:${s.color}"></div></div>
          </div>`).join("");
        return`<div class="pres" style="${!solo&&rank===0?`border-color:${p.color};border-width:3px`:""}">
          <div class="pre-hdr"><span class="pre-name" style="color:${p.color}">${!solo&&rank===0?"🏆 ":""}${p.name}</span><span class="pre-total">${total} pistettä</span></div>
          <div class="pre-sgrid">${sgrid}</div>
          ${buildStrengths(p)}
          ${buildMoment(p)}
          <div class="story-box" style="margin-top:10px"><div class="story-label">Sinun suuntasi</div><div class="trend-row">${pills}</div><div class="story-text">${story}</div></div>
          ${p.motives&&p.motives.length>0?`<div class="story-box" style="margin-top:8px;background:#EEEDFE;border-color:#AFA9EC;">
            <div class="story-label" style="color:#3C3489">🃏 Pokerikortti — miksi vaihdoit?</div>
            ${p.motives.map(m=>`<div style="font-size:13px;color:#26215C;margin-bottom:4px;line-height:1.5">
              <span style="font-weight:800">${m.card}:</span> ${m.motive}
            </div>`).join("")}
          </div>`:""}
          ${p.reflectAnswer?`<div class="reflect-answer-box" style="margin-top:8px;">
            <span class="reflect-answer-label">💭 Vaikein valinta — sinun vastauksesi</span>
            <div class="reflect-answer-text">"${p.reflectAnswer}"</div>
          </div>`:""}
          ${buildChart(p)}
        </div>`;
      }).join("")}
      <button class="primary-btn" id="restart" style="margin-top:.5rem">Pelaa uudelleen</button>
    </div>`;
  document.getElementById("restart").addEventListener("click",renderIntro);
}

renderIntro();
</script>
</body>
</html>
